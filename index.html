const DATA=[{"id":"4836795c-a424-4f7a-83e0-6561c5a4a907","name":"Piloto Privado de Avión — Banco DGAC (actualización julio 2025)","date":"D:20250731134618-04'00'","subjects":[{"name":"AERODINAMICA PP AVION","q":[{"n":1,"s":"Las fuerzas aerodinámicas que actúan sobre un avión en vuelo son:","o":[["A","Sustentación, peso y tracción."],["B","Sustentación, peso y resistencia."],["C","Sustentación, peso, resistencia y tracción."],["D","Ninguna de las anteriores."]],"a":"C","p":1,"src":"cruce"},{"n":2,"s":"Durante un vuelo nivelado, las fuerzas aerodinámicas que actúan sobre el avión permanecen.","o":[["A","Constantes y en equilibrio."],["B","Constantes y en desequilibrio."],["C","En desequilibrio."],["D","Solo Constantes."]],"a":"A","p":1,"src":"cruce"},{"n":3,"s":"El ángulo agudo formado por la línea de cuerda del ala y el eje longitudinal del avión, se denomina:","o":[["A","Perfil aerodinámico."],["B","Angulo de ataque."],["C","Angulo de incidencia."],["D","Cobertura."]],"a":"C","p":1,"src":"cruce"},{"n":4,"s":"La capa limite es una capa o extracto de aire que sufre una retardación local debido a la viscosidad del aire.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":2,"src":"cruce"},{"n":5,"s":"La distancia máxima de punta a punta de las alas, se denomina:","o":[["A","Superficie alar."],["B","Forma del ala."],["C","Envergadura de las alas."],["D","Ninguna de las anteriores."]],"a":"C","p":2,"src":"cruce"},{"n":6,"s":"Sustentación es la fuerza hacia abajo creada por un perfil aerodinámico cuando es desplazado a través del aire.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":2,"src":"cruce"},{"n":7,"s":"Que sucede cuando se tiene un perfil alar, que posee mayor \"cobertura\" en la parte superior, que en la parte inferior del ala\".","o":[["A","La velocidad del flujo de aire en la parte superior es mayor, debido a la mayor distancia que recorre en un mismo periodo de tiempo que en la parte inferior."],["B","Por el efecto de la mayor curvatura en la parte superior del perfil alar, existe menor presión de aire que en la parte inferior del perfil alar."],["C","La mayor presión existente en la parte inferior del perfil alar, empuja esta hacia arriba, produciéndose la sustentación"],["D","Todas son correctas."]],"a":"D","p":2,"src":"cruce"},{"n":8,"s":"El centro de gravedad del avión es el punto sobre el avión el cual se considera que se concentra todo el peso.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":2,"src":"cruce"},{"n":9,"s":"La ubicación del centro de gravedad esta en :","o":[["A","El eje transversal del avión."],["B","A lo largo del eje longitudinal del avión y en algún lugar cerca del centro de presión del ala."],["C","A lo largo del eje vertical del avión y en algún lugar cerca del centro de presión del ala."],["D","A lo largo del eje longitudinal del avión y en algún lugar cerca del ángulo de incidencia."]],"a":"B","p":3,"src":"cruce"},{"n":10,"s":"La resistencia total puede ser clasificada en:","o":[["A","Resistencia inducida."],["B","Resistencia parásita."],["C","Resistencia útil o efectiva."],["D","A y B son correctas."]],"a":"D","p":3,"src":"cruce"},{"n":11,"s":"El subproducto indeseable, pero inevitable de la sustentación útil o efectiva se denomina:","o":[["A","Resistencia de forma."],["B","Resistencia parásita."],["C","Resistencia inducida."],["D","Resistencia de fricción."]],"a":"C","p":3,"src":"cruce"},{"n":12,"s":"La resistencia inducida tiene una relación directa con:","o":[["A","El viento relativo y disminuye en proporción directa a los aumentos de este."],["B","El ángulo de ataque y disminuye en proporción directa a los aumentos de este."],["C","El ángulo de ataque y aumento en proporción directa a la disminución de este."],["D","El ángulo de ataque y aumenta en proporción directa a los aumentos de este."]],"a":"D","p":3,"src":"cruce"},{"n":13,"s":"¿Qué factores afectan la resistencia parásita?","o":[["A","Aerodinámica del objeto, densidad del aire, tamaño del objeto, turbulencia."],["B","Aerodinámica del objeto, densidad del aire, tamaño del objeto, velocidad."],["C","Aerodinámica del objeto, densidad del aire, temperatura, velocidad."],["D","Aerodinámica del objeto, tamaño, turbulencia, temperatura."]],"a":"C","p":4,"src":"cruce"},{"n":14,"s":"La resistencia causada por el área frontal de los componentes del avión, expuesto a la corriente del aire se denomina:","o":[["A","Resistencia inductor."],["B","Resistencia de forma."],["C","Resistencia de fricción."],["D","Resistencia de interferencia."]],"a":"B","p":4,"src":"cruce"},{"n":15,"s":"Si las superficies de un avión se encuentran sucias o ásperas ¿qué sucede?","o":[["A","Aumenta la resistencia de fricción superficial."],["B","Aumenta la resistencia de interferencia."],["C","Aumenta la resistencia de forma."],["D","Disminuye la resistencia de forma."]],"a":"A","p":4,"src":"cruce"},{"n":16,"s":"Que sucede si las intersecciones de las alas y las secciones del empenaje con el fuselaje, no se usan carenados fusiformes para hacer aerodinámicas estas secciones.","o":[["A","Aumenta la resistencia de fricción."],["B","Disminuye la resistencia de fricción."],["C","Aumenta la resistencia de interferencia."],["D","Disminuye la resistencia de interferencia."]],"a":"C","p":4,"src":"cruce"},{"n":17,"s":"Si la resistencia inducida disminuye, significa que la:","o":[["A","Velocidad aumenta y ángulo de ataque aumenta."],["B","Velocidad disminuye y ángulo de ataque disminuye."],["C","Velocidad aumenta y ángulo de ataque disminuye."],["D","Velocidad disminuye y ángulo de ataque aumenta."]],"a":"C","p":4,"src":"cruce"},{"n":18,"s":"¿Por qué es importante conocer el cuociente L/D máximo?","o":[["A","Porque en este punto se requiere la menor tracción ya que existe la mínima resistencia total."],["B","Es importante para la determinación del alcance y autonomía máxima del avión."],["C","A y B son correctas."],["D","Ninguna es correcta."]],"a":"C","p":5,"src":"cruce"},{"n":20,"s":"Una separación de la capa límite, da como resultado:","o":[["A","Aumentar la velocidad y aumentar el ángulo de ataque."],["B","Pérdida considerable de la sustentación."],["C","Pérdida de peso del avión."],["D","Ninguna es correcta."]],"a":"B","p":5,"src":"cruce"},{"n":21,"s":"Para recuperar un stall, Ud. Deberá.","o":[["A","Aumentar la velocidad y aumentar el ángulo de ataque."],["B","Disminuir el ángulo de ataque."],["C","Aumentar la velocidad solamente."],["D","Todas las anteriores."]],"a":"B","p":5,"src":"cruce"},{"n":22,"s":"Ud. va en vuelo recto y nivelado, al aumentar la tracción y mantener las condiciones de vuelo, sucede que:","o":[["A","Aumenta la velocidad, mayor resistencia."],["B","Aumenta la velocidad, menor resistencia."],["C","Disminuye la velocidad, mayor resistencia."],["D","Disminuye la velocidad, menor resistencia."]],"a":"A","p":5,"src":"cruce"},{"n":23,"s":"Ud. va en vuelo recto y nivelado y la sustentación se torna menor que el peso sucede que:","o":[["A","El avión permanece en vuelo recto y nivelado."],["B","El avión iniciara un ascenso."],["C","El avión iniciara un descenso."],["D","A y B son correctas."]],"a":"C","p":6,"src":"cruce"},{"n":24,"s":"¿Cuáles son los factores que afectan la sustentación y la resistencia?","o":[["A","Superficie Alar, la forma del perfil aerodinámico."],["B","El ángulo de ataque, velocidad del aire que pasa sobre el ala, densidad del aire."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":6,"src":"cruce"},{"n":25,"s":"Una pequeña capa de escarcha sobre las alas pueden impedir que un avión despegue, porque se perturba el flujo laminar de aire sobre la superficie de las alas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":6,"src":"cruce"},{"n":26,"s":"Por el efecto que produce la densidad del aire sobre la sustentación y la resistencia, podemos decir que:","o":[["A","La densidad del aire no produce efecto alguno."],["B","A medida que aumenta la densidad del aire, disminuye la sustentación y aumenta la resistencia."],["C","A medida que aumenta la densidad del aire, aumenta la sustentación y la resistencia."],["D","A medida que aumenta la densidad del aire disminuye la sustentación y la resistencia."]],"a":"C","p":6,"src":"cruce"},{"n":27,"s":"En un día caluroso, la carrera de despegue del avión será:","o":[["A","Igual a un día normal con temperatura estándar."],["B","Será más corta porque el aire es más denso."],["C","Será más larga porque el aire se expande al calentarse."],["D","Ninguna de las anteriores."]],"a":"C","p":6,"src":"cruce"},{"n":28,"s":"El aire menos denso, que efectos produce en la performance del avión.","o":[["A","Disminuye la potencia del motor."],["B","Disminuye la eficiencia de la hélice debido a la pérdida de potencia."],["C","Las aspas por ser perfiles aerodinámicos son menos efectivas cuando el aire es menos denso."],["D","Todas son verdaderas."]],"a":"D","p":7,"src":"cruce"},{"n":29,"s":"La combinación de grandes altitudes, altas temperaturas y un alto contenido de humedad, sumado a una pista corta y avión cargado, podrían tener consecuencia desastrosas si el piloto no da debida atención a las tablas de perfomance de su avión.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":7,"src":"cruce"},{"n":30,"s":"El avión posee tres ejes de rotación, alrededor de los cuales se efectúan los movimientos, estos son:","o":[["A","Eje lateral, vertical, longitudinal."],["B","Eje vertical, transversal, horizontal,"],["C","Eje lateral, vertical, transversal."],["D","Eje vertical, horizontal, lateral."]],"a":"A","p":7,"src":"cruce"},{"n":31,"s":"El cabeceo es la rotación producida alrededor del eje:","o":[["A","Transversal."],["B","Lateral."],["C","Horizontal."],["D","Vertical."]],"a":"B","p":7,"src":"cruce"},{"n":32,"s":"La guiñada es controlada por:","o":[["A","Elevadores."],["B","Alerones."],["C","Timón de dirección."],["D","Todas son correctas."]],"a":"C","p":7,"src":"cruce"},{"n":33,"s":"¿Porque es importante la estabilidad longitudinal?","o":[["A","Porque determina en gran parte l ,"A y B son correctas."],["D","Ninguna es correcta."]],"a":"A","p":9,"src":"cruce"},{"n":43,"s":"La inclinación máxima para aviones livianos convencionales es de ........., lo que produce un factor de carga de.........","o":[["A","50 grados - 2g."],["B","60 grados - 3 g."],["C","50 grados - 3g."],["D","60 grados - 2g."]],"a":"D","p":10,"src":"cruce"},{"n":44,"s":"La velocidad máxima, a la cual un avión puede ser entrado en stall con seguridad, sin exceder el factor de carga, se denomina:","o":[["A","Velocidad máxima de stall."],["B","Velocidad de stall."],["C","Velocidad de maniobra de diseño."],["D","Ninguna de las anteriores."]],"a":"C","p":10,"src":"cruce"},{"n":45,"s":"De que depende la cantidad de carga excesiva que puede imponerse al avión?","o":[["A","De la altura."],["B","Del ángulo de ataque."],["C","De la velocidad."],["D","Ninguna de las anteriores."]],"a":"C","p":10,"src":"cruce"},{"n":47,"s":"Cuando UD. vuela en aire extremadamente turbulento, UD., debe:","o":[["A","Aumentar la velocidad sobre la de maniobra."],["B","Reducir velocidad y bajar Flap."],["C","Reducir velocidad a la de maniobra."],["D","Ninguna es correcta."]],"a":"C","p":10,"src":"cruce"},{"n":48,"s":"A velocidad bajo la velocidad de maniobra, el avión entrara en stall antes que las cargas se hagan excesivas","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":11,"src":"cruce"},{"n":49,"s":"Las razones por las que se debe evitar virajes con un ángulo excesivo son:","o":[["A","La velocidad de stall aumenta."],["B","El límite del factor de carga puede ser sobrepasado."],["C","A y B son correctas."],["D","Ninguna es correcta."]],"a":"C","p":11,"src":"cruce"},{"n":51,"s":"Las alas con gran coeficiente de sustentación tienen una gran curvatura convexa en su cara superior y una concavidad en su cara inferior.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":11,"src":"cruce"},{"n":52,"s":"A una altitud aproximada de 21.000 pies, la densidad del aire es la mitad que al nivel del mar. De esta forma para que un avión mantenga el valor de su sustentación a grandes altitudes, deberá aumentar la velocidad aérea verdadera (VAV) del aire sobre sus alas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":11,"src":"cruce"},{"n":53,"s":"El aire menos denso produce una disminución de la sustentación, además de este, ¿qué otros efectos se producen?","o":[["A","Pérdida de potencia del motor."],["B","Disminuye la eficiencia de la hélice."],["C","La aceleración en la carrera de despegue es más lenta."],["D","Todas las anteriores son correctas."]],"a":"D","p":12,"src":"cruce"},{"n":54,"s":"El efecto de torque aumenta en proporción directa a la potencia del motor, velocidad y actitud del avión.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":12,"src":"cruce"},{"n":55,"s":"Las fuerzas durante la carrera de despegue, a medida que la velocidad aumenta, sucede lo siguiente:","o":[["A","La fricción de la pista disminuye."],["B","La resistencia al avance aumenta."],["C","La tracción para el avión a pistón disminuye."],["D","Todas las anteriores son correctas."]],"a":"D","p":12,"src":"cruce"},{"n":56,"s":"¿Qué factores afectan el despegue?","o":[["A","Peso del avión, dirección y velocidad del viento."],["B","Tipo de pista elevación de la pista."],["C","Velocidad de despegue."],["D","Todas las anteriores son correctas."]],"a":"D","p":12,"src":"cruce"},{"n":58,"s":"La distancia mínima de despegue es de primordial importancia para el piloto, pues define los requerimientos de longitud de pista para las operaciones aéreas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":13,"src":"cruce"},{"n":59,"s":"Un mayor peso en el despegue.","o":[["A","Disminuye la carrera de despegue."],["B","Aumenta la carrera de despegue."],["C","Aumenta la fricción a la pista."],["D","B y C son correctas."]],"a":"D","p":13,"src":"cruce"},{"n":60,"s":"Durante la carrera de despegue con viento en contra, el avión alcanza su velocidad de despegue a menor velocidad terrestre y necesita menor longit ,"p":21,"src":"cruce"},{"n":99,"s":"Si el avión que está planeando, está volando a una velocidad justo por encima de la stall, este está operando con un ángulo de ataque máximo y por lo tanto máxima sustentación, esta situación produce el mayor ángulo de planeo, para lograr la mayor distancia de planeo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":21,"src":"cruce"},{"n":101,"s":"¿Cuál es la razón de porque un avión es inclinado lateralmente para efectuar un viraje?","o":[["A","Debe ser inclinado lateralmente porque la misma fuerza (sustentación) que mantiene al avión en vuelo es utilizada para hacer virar el avión."],["B","El avión es inclinado lateralmente y se aplica presión hacia atrás al elevador esto cambia la dirección de la sustentación, este aumento de sustentación hace que el avión vire."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"C","p":21,"src":"cruce"},{"n":102,"s":"En un viraje la fuerza de sustentación se puede descomponer en dos fuerzas, una vertical y otra horizontal, a que fuerzas se oponen ambas componentes?.","o":[["A","La componente vertical se opone a la fuerza centrípeta."],["B","La componente horizontal se opone a la fuerza de gravedad."],["C","La componente vertical se opone a la gravedad y la componente horizontal a la fuerza centrifuga."],["D","A y B son correctas."]],"a":"C","p":22,"src":"cruce"},{"n":103,"s":"¿Qué efecto produce durante la carrera de aterrizaje subir flaps?","o":[["A","No produce ningún efecto favorable al aterrizaje."],["B","Aumenta la sustentación por la cual la distancia de aterrizaje aumentara considerablemente."],["C","Pierde efectividad los frenos."],["D","Disminuye el coeficiente de sustentación, aumentando la fuerza normal y la efectividad de los frenos."]],"a":"D","p":22,"src":"cruce"},{"n":104,"s":"En las pistas situadas a gran altura todos los aviones necesitan una mayor longitud de pista que el nivel del mar , para aterrizar, esto se debe a que si los otros factores permanecen const "]],"a":"C","p":147,"src":"cruce"},{"n":45,"s":"Servicio de control de tránsito aéreo para el tránsito de aeródromo, se denomina:","o":[["A","Servicio de control de aproximación."],["B","Servicio de control de aeródromo."],["C","Servicio de control de área."],["D","Servicio de control de tránsito aéreo."]],"a":"B","p":147,"src":"cruce"},{"n":46,"s":"¿Cuál es el período de vigencia de los certificados médicos para la licencia de piloto privado menor de 40 años?","o":[["A","12 meses."],["B","06 meses."],["C","24 meses."],["D","Ninguna de las anteriores."]],"a":"C","p":147,"src":"cruce"},{"n":47,"s":"Toda área delimitada, terrestre o acuática habilitada por la autoridad aeronáutica y destinada a la llegada, salida y maniobra de aeronaves en la superficie, se llama:","o":[["A","Aeródromo."],["B","Aeródromo controlado."],["C","Aeródromo de alternativa."],["D","Aeropuerto."]],"a":"A","p":147,"src":"cruce"},{"n":48,"s":"Los tipos de aeródromo de alternativa que existen son:","o":[["A","Aeródromo de alternativa post despegue."],["B","Aeródromo de alternativa en ruta."],["C","Aeródromo de alternativa de destino."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":147,"src":"cruce"},{"n":49,"s":"Distancia vertical entre un nivel, punto u objeto considerado como punto, y una referencia específica, se denomina:","o":[["A","Altitud de presión."],["B","Altitud de transición."],["C","Altura."],["D","Ninguna de las anteriores."]],"a":"C","p":148,"src":"cruce"},{"n":50,"s":"La parte del aeródromo que ha de utilizarse para el despegue, el aterrizaje y el rodaje de aeronaves, excluyendo las plataformas, se denomina:","o":[["A","Área de maniobras."],["B","Área de movimiento."],["C","Área de control."],["D","Altitud de aterrizaje."]],"a":"A","p":148,"src":"cruce"},{"n":51,"s":"Expresión de la presión atmosférica mediante la altitud que corresponde a esa presión en la atmósfera tipo.","o":[["A","Altura."],["B","Altitud de transición."],["C","Altitud de presión."],["D","Altitud."]],"a":"C","p":148,"src":"cruce"},{"n":52,"s":"La expresión \"AERODROMO CONTROLADO\", significa que es un Aeródromo en que se facilita servicio de control de tránsito aéreo para el tránsito del aeródromo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":148,"src":"cruce"},{"n":53,"s":"El símbolo usado para designar las condiciones meteorológicas de vuelo visual, es:","o":[["A","VFR."],["B","IMC."],["C","VMC."],["D","IFR."]],"a":"A","p":148,"src":"cruce"},{"n":54,"s":"El espacio aéreo controlado que se extiende hacia arriba desde la superficie terrestre hasta un límite superior especificado, se denomina:","o":[["A","Zona de tránsito de aeródromo."],["B","Zona restringida."],["C","Zona de control."],["D","Zona prohibida."]],"a":"C","p":149,"src":"cruce"},{"n":55,"s":"Techo de nubes, es la altura a que, sobre la tierra o el agua, se encuentra la base de la capa inferior de nubes por debajo de 3000 m (9000 ft) y que cubre más de la mitad del cielo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":149,"src":"cruce"},{"n":56,"s":"En el caso de que exista peligro de colisión entre dos aeronaves en rodaje en el área de movimiento de un aeródromo, se aplicará lo siguiente:","o":[["A","Cuando dos aeronaves se aproximen de frente, o casi de frente, ambas se detendrán o de ser posible, alterarán su rumbo hacia la derecha para mantenerse a suficiente distancia."],["B","Cuando dos aeronaves se encuentren en un rumbo convergente, la que tenga a la otra a su derecha cederá el paso."],["C","Toda aeronave que sea alcanzada por otra tendrá el derecho de paso y la aeronave que la alcance se mantendrá a suficiente distancia de la trayectoria de la otra aeronave."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":149,"src":"cruce"},{"n":57,"s":"La información referente al vuelo proyectado o a parte del mismo, que ha de suministrarse a las dependencias de los servicios de tránsito aéreo, se dará en forma de plan de vuelo. Este se presentará antes de realizar:","o":[["A","Cualquier vuelo o parte del mismo al que tenga que prestarse servicio de control de tránsito aéreo."],["B","Cualquier vuelo dentro de áreas designadas o a lo largo de rutas designadas, cuando así lo requiera la autoridad ATS competente para facilitar el suministro de servicios de información de vuelo, de alerta y de búsqueda y salvamento."],["C","Todo vuelo a través de fronteras internacionales."],["D","Todas las anteriores."]],"a":"D","p":149,"src":"cruce"},{"n":58,"s":"En vuelos VFR no se debe despegar ni aterrizar en ningún aeródromo dentro de una zona de control, ni se debe entrar en la zona de tránsito de aeródromos o en el circuito de tránsito de dicho aeródromo, si el techo de nubes y la visibilidad en tierra es inferior a:","o":[["A","300 metros y 1,5 Km."],["B","300 metros y 5 Km."],["C","450 metros y 5 Km."],["D","450 metros y 8 Km."]],"a":"A","p":150,"src":"cruce"},{"n":62,"s":"Vuelo VFR Especial, es un Vuelo VFR al que el control de tránsito aéreo ha concedido autorización, de acuerdo a los requisitos establecidos por la autoridad aeronáutica y sólo para ingresar o salir de zonas de control y que vayan a aterrizar o despegar de o en aeródromos situados dentro de las mismas, en condiciones meteorológicas inferiores a las VMC.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"cruce"},{"n":63,"s":"Vuelos VFR Nocturno, es aquel Vuelo realizado durante el período comprendido entre el fin del crepúsculo civil vespertino (FCCV) y el comienzo del crepúsculo civil matutino (CCCM), de acuerdo a las reglas de vuelo visual y a los requisitos que establezca la autoridad aeronáutica.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"cruce"},{"n":64,"s":"Una aeronave apagando y encendiendo sucesivamente las luces de navegación, de forma tal, que se distingan de las luces de navegación de destellos. Significa que desea avisar que tiene dificultades que la obligan a aterrizar, pero no necesita asistencia inmediata.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"cruce"},{"n":65,"s":"El servicio de control de área es el servicio de control de tránsito aéreo para la llegada y salida de vuelos controlados.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"cruce"},{"n":66,"s":"El vuelo VFR nocturno, es una excepción al vuelo VFR y podrá ser realizado en zonas designadas por la autoridad aeronáutica competente, bajo condiciones que esta determine en los procedimientos (DAP) correspondientes.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"cruce"},{"n":67,"s":"Luz verde fija, tanto en aire como en tierra significa:","o":[["A","Autorizado para aterrizar."],["B","Autorizado para despegar."],["C","Alto."],["D","A y B son correctas."]],"a":"D","p":152,"src":"cruce"},{"n":68,"s":"Las listas de verificación serán utilizadas por las tripulaciones de vuelo, Antes, Durante y Después de todas las fases de las operaciones y en caso de emergencias, a fin de asegurar que se cumplen los procedimientos operacionales contenidos en los manuales:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":152,"src":"cruce"},{"n":69,"s":"La proyección sobre la superficie terrestre de la trayectoria de una aeronave, cuya dirección en cualquier punto se expresa generalmente en grados a partir del norte (geográfico, magnético o de la cuadrícula), se denomina:","o":[["A","Navegación."],["B","Rumbo."],["C","Vía."],["D","Derrota."]],"a":"B","p":152,"src":"cruce"},{"n":70,"s":"Los objetivos de los Servicios de Tránsito Aéreo, son:","o":[["A","Prevenir colisiones entre aeronaves, Prevenir colisiones entre aeronaves en el área de maniobras y entre esas y los obstáculos que haya en dicha área."],["B","Acelerar y mantener ordenadamente el movimiento del tránsito aéreo y proporcionar información útil para la marcha segura y eficaz del vuelo."],["C","Notificar a los organismos pertinentes respecto a las aeronaves que necesitan ayuda de búsqueda y salvamento prestando la mayor colaboración posible a dicho ,"src":"cruce"},{"n":77,"s":"El acuse de recibo por parte de una aeronave con falla comunicaciones, en vuelo, durante las horas de luz diurna, es:","o":[["A","Emitiendo destellos dos veces con los faros de aterrizaje de la aeronave, si no tiene, encendiendo y apagando dos veces las luces de navegación."],["B","Moviendo los alerones o el timón de dirección."],["C","Balanceando las alas de la aeronave."],["D","Ninguna de las anteriores es verdadera."]],"a":"B","p":154,"src":"cruce"},{"n":78,"s":"Se denomina aeronave que alcanza a la que se aproxima a otra por detrás, siguiendo una línea que forme un ángulo menor de 70 grados con el plano de simetría de la que va delante.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":154,"src":"cruce"},{"n":80,"s":"La distancia vertical entre un nivel, punto u objeto considerado como punto y una referencia específica, se denomina:","o":[["A","Altitud de presión."],["B","Altura."],["C","Altitud de transición."],["D","A y B son correctas."]],"a":"B","p":154,"src":"cruce"},{"n":81,"s":"Parte del área de movimiento destinada al aterrizaje o despegue de aeronaves, se denomina:","o":[["A","Área de control."],["B","Área de aterrizaje."],["C","Área de maniobras."],["D","Área de movimiento."]],"a":"C","p":155,"src":"cruce"},{"n":82,"s":"Área de control o parte de ella dispuesta en forma de corredor, se denomina:","o":[["A","AFIS."],["B","Altitud."],["C","Aerovía."],["D","Área de Control."]],"a":"C","p":155,"src":"cruce"},{"n":83,"s":"Calle de rodaje. Se define como una vía definida en un aeródromo terrestre, establecida para el rodaje de aeronaves y destinada a proporcionar enlace entre una y otra parte del aeródromo, incluyendo:","o":[["A","Calle de acceso al puesto de estacionamiento de aeronave."],["B","Calle de rodaje en la plataforma."],["C","Calle de salida rápida."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":155,"src":"cruce"},{"n":84,"s":"Condiciones meteorológicas expresadas en términos de visibilidad, y distancia ronave que navega en un tramo de una ruta ATS definida por referencia a los radiofaros omnidireccionales VHF, se espera que transfiera su referencia de navegación primaria, de la instalación por detrás de la aeronave a la instalación inmediata por delante de la aeronave, se denomina:","o":[["A","Punto de notificación."],["B","Punto de notificación facultativo."],["C","Punto de notificación obligatorio."],["D","Punto de cambio."]],"a":"D","p":158,"src":"cruce"},{"n":96,"s":"El servicio de control de tránsito aéreo para la llegada y salida de vuelos controlados, se denomina:","o":[["A","Servicio de control de aproximación."],["B","Servicio de control de aeródromo."],["C","Servicio de control de área."],["D","Servicio de información de vuelo."]],"a":"B","p":158,"src":"cruce"},{"n":97,"s":"El servicio cuya finalidad es aconsejar y facilitar información útil para la realización segura y eficaz de los vuelos, se denomina:","o":[["A","Servicio de Control de Aproximación."],["B","Servicio de Control de aeródromo."],["C","Servicio de información de vuelo de aeródromo."],["D","Servicio de información de Vuelo."]],"a":"D","p":158,"src":"cruce"},{"n":98,"s":"La expresión genérica que se aplica, según el caso, a los servicios de información de vuelo, alerta, asesoramiento de tránsito aéreo, control de tránsito aéreo, servicios de control de área, control de aproximación o control de aeródromos, se denomina:","o":[["A","Servicio de Tránsito Aéreo."],["B","Servicio de Información de Vuelo."],["C","Servicio de Control de Vuelo."],["D","Servicio de Control de Área."]],"a":"A","p":159,"src":"cruce"},{"n":100,"s":"Se denomina tránsito de aeródromo a todo el tránsito que tiene lugar en el área de maniobras de un aeródromo, y todas las aeronaves que vuelen en las inmediaciones del mismo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":159,"src":"cruce"},{"n":101,"s":"Un piloto con experiencia que proyecta efectuar un vuelo Santiago- Puerto Montt, no necesita familiarizarse con toda la información disponible apropiada al vuelo, por cuanto gran parte de esa información siempre es conocida.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":159,"src":"cruce"},{"n":102,"s":"Cederán el paso a las aeronaves que estén aterrizando o en las fases finales de una aproximación para aterrizar.","o":[["A","Las aeronaves en vuelo."],["B","Las que estén operando en tierra o agua."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":159,"src":"cruce"},{"n":103,"s":"El piloto al mando puede, ya sea en vuelo u operando en el área de movimiento de un aeródromo, apagar o reducir la intensidad de cualquiera luz de destello de a bordo, cuando:","o":[["A","Dichas luces pudieran afectar adversamente el desempeño satisfactorio de sus funciones."],["B","Expongan a un observador externo a un deslumbramiento perjudicial."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":160,"src":"cruce"},{"n":104,"s":"Que precauciones u observaciones (entre otras) deberán tener las aeronaves que operen en un aeródromo o en sus cercanías, tanto si se hallan o no en una zona de tránsito de aeródromo.","o":[["A","Observar el transito del aeródromo, a fin de evitar colisiones."],["B","De ajustarse al circuito de transito formado por otras aeronaves en vuelo, o evitarlas."],["C","Harán todos los virajes hacia la izquierda al aproximarse para aterrizar y después del despegue, a menos que se les ordene lo contrario."],["D","Todas anteriores son verdaderas."]],"a":"D","p":160,"src":"cruce"},{"n":105,"s":"Toda aeronave que sea alcanzada por otra tendrá el derecho de paso, y la que alcance cambiará su rumbo para mantener suficiente distancia.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":160,"src":"cruce"},{"n":106,"s":"Cuando dos aeronaves se aproximen de frente o casi de frente, y haya peligro de colisión, ambas aeronaves deben alterar su ......... hacia la ...........:","o":[["A","Distancia - Izquierda."],["B","Velocidad - Izquierda."],["C","Rumbo - Derecha."],["D","Rumbo - Izquierda."]],"a":"C","p":160,"src":"cruce"},{"n":107,"s":"Un vuelo controlado deberá notificar a las dependencias correspondientes de los servicios de tránsito aéreo, tan pronto como sea posible, la hora y nivel a que se pasa cada uno de los puntos de notificación obligatorio designados.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":161,"src":"cruce"},{"n":108,"s":"Las medidas que ha de adoptar la aeronave interceptada, son:","o":[["A","Seguirá inmediatamente las instrucciones dadas por la aeronave interceptora, interpretando y respondiendo a las señales visuales de acuerdo con las especificadas en el Apéndice D del DAN 91."],["B","Lo notificará inmediatamente, si es posible, a la dependencia ATS apropiada."],["C","Tratará inmediatamente de comunicarse por radio con la aeronave interceptora o con la dependencia de control de interceptación apropiada y si está equipada con respondedor SSR, seleccionará inmediatamente el modo A, Código 7700."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":161,"src":"cruce"},{"n":110,"s":"ZONA DE TOMA DE CONTACTO: se denomina a:","o":[["A","Parte de la pista, situada después del umbral, destinada a que los aviones que aterrizan hagan el primer contacto con la pista."],["B","Zona donde se debe establecer el primer contacto radiofónico en las inmediaciones de un aeródromo."],["C","Zona donde se establece una comunicación aeronáutica."],["D","Zona nula."]],"a":"C","p":161,"src":"cruce"},{"n":111,"s":"¿Qué significado tiene una señal blanca y horizontal en forma de pesas, ubicada en un área de señales?:","o":[["A","Autoriza solo el uso de pistas."],["B","Son instrucciones para el rodaje."],["C","Aviso que hay planeadores volando."],["D","Indica que las aeronaves deben aterrizar, despegar y rodar únicamente en las pistas y en las calles de rodaje."]],"a":"D","p":162,"src":"cruce"},{"n":113,"s":"Hoy en día en un ambiente de vuelo saturado, la primera responsabilidad en cuanto a evitar colisiones torizado por la DGAC, mientras reciba instrucción de vuelo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":164,"src":"cruce"},{"n":124,"s":"Todas aquellas comprobaciones que se efectúan a intervalos de tiempo regulares o después de un cierto número de horas de funcionamiento de una aeronave, se denomina:","o":[["A","Inspecciones periódicas."],["B","Trabajos Aéreos."],["C","Mantenimiento."],["D","Inspector Visual."]],"a":"A","p":164,"src":"cruce"},{"n":125,"s":"El piloto al mando observará las leyes, reglamentos y procedimientos pertinentes de los Estados en que opere la aeronave.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":164,"src":"cruce"},{"n":126,"s":"¿En qué caso el piloto al mando puede tomar medidas que infrinjan los reglamentos o los procedimientos locales?","o":[["A","En caso de emergencia que ponga en peligro la seguridad de la aeronave o de las personas."],["B","En ningún caso."],["C","Solo en caso de incendio de la aeronave."],["D","Solo en condiciones meteorológicas adversas."]],"a":"A","p":165,"src":"cruce"},{"n":127,"s":"En qué circunstancias está prohibido fumar en las aeronaves.","o":[["A","Durante el movimiento de la aeronave en la superficie."],["B","En cada despegue, cada aterrizaje."],["C","Cuando lo considere necesario el piloto al mando."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":165,"src":"cruce"},{"n":128,"s":"Que equipos (Utensilios) y documentación entre otros deberán poseer las aeronaves en todos los vuelos:","o":[["A","Al menos un botiquín de primeros auxilios, un extinguidor, cinturones de seguridad para cada asiento, fusibles eléctricos de repuesto."],["B","El manual de vuelo del avión, cartas aeronáuticas actualizadas, las claves de señales de tierra-aire y aire-tierra con fines de búsqueda y salvamento."],["C","Certificado matrícula de la aeronave y certificado aeronavegabilidad."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":165,"src":"cruce"},{"n":132,"s":"Los aeródromos civiles se dividen en:","o":[["A","Aeródromos públicos y privados."],["B","Aeródromos militares y públicos."],["C","Aeródromos públicos, privados y militares."],["D","Ninguna de las anteriores."]],"a":"A","p":166,"src":"cruce"},{"n":133,"s":"En caso de emergencia, cualquier aeronave podrá aterrizar en aeródromos privados o en superficies que no sean aeródromos:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":166,"src":"cruce"},{"n":134,"s":"Normalmente la frecuencia que utilizarán las aeronaves para transmitir su posición e intenciones, cuando operen en un aeródromo o sus inmediaciones y este no es controlado o con AFIS, es:","o":[["A","110, 1 MHZ."],["B","119, 1 MHZ."],["C","119, 2 MHZ."],["D","118, 2 MHZ."]],"a":"D","p":166,"src":"cruce"},{"n":135,"s":"Una aeronave que esté volando con Plan de Vuelo visual, en las cercanías de un aeródromo con servicio AFIS, deberá:","o":[["A","Estar alerta a cualquier llamado."],["B","Contactar a 10 MN del AFIS en la Frecuencia apropiada para notificar posición, altitud o nivel e intenciones."],["C","Pasar inadvertido."],["D","Ninguna de las anteriores."]],"a":"B","p":166,"src":"cruce"},{"n":137,"s":"Aeronáutica no comercial es la que tiene por objeto actividades de vuelo sin fines de lucro, tales como la instrucción, recreación o deporte. La aviación no comercial no podrá realizar servicios de transporte o trabajos aéreos remunerados. Sin embargo, previa autorización de la Junta de Aeronáutica Civil, la aviación no comercial podrá efectuar servicios de transporte o trabajos aéreos pagados, siempre que éstos no persigan fines de lucro, cuando la aeronáutica comercial no esté en condiciones de prestar dichos servicios.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":167,"src":"cruce"},{"n":138,"s":"Reglamentos Aeronáuticos (DAR): Son disposiciones que establecen normas de carácter general reglamentario orientadas a entregar seguridad y diversos servicios a la navegación aérea. Su numeración y su formato se derivan de los Anexos al Convenio de Aviación Civil Internacional (OACI).","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":167,"src":"cruce"},{"n":140,"s":"La mejor fuente de información para buscar una frecuencia del control de tierra de un determinado aeródromo controlado, es:","o":[["A","El Manual de información del piloto."],["B","Una carta aeronáutica."],["C","La AIP-CHILE."],["D","Una estación aeronáutica."]],"a":"C","p":168,"src":"cruce"},{"n":141,"s":"Ninguna aeronave será autorizada para el vuelo sin la previa expedición de un certificado de aeronavegabilidad por parte de la autoridad aeronáutica.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":168,"src":"cruce"},{"n":142,"s":"En toda aeronave que vuele sobre territorio nacional se deben portar los siguientes documentos:","o":[["A","Certificado de matrícula y de aeronavegabilidad."],["B","Licencias y habilitaciones de la tripulación y bitácoras."],["C","Documentos relativos a la aeronave, a los pasajeros, a la carga y a la correspondencia, que requieran los reglamentos."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":168,"src":"cruce"},{"n":144,"s":"Para los efectos del código Aeronáutico, se entiende que una aeronave se encuentra en vuelo desde el momento en que:","o":[["A","Pone en marcha el motor."],["B","Enciende las luces de navegación."],["C","Comienza a moverse con el objeto de despegar, hasta detenerse una vez finalizado el vuelo."],["D","Cuando aplica potencia para despegar."]],"a":"C","p":168,"src":"cruce"},{"n":145,"s":"Aquella persona que, sin haber obtenido las licencias o habilitaciones competentes, desempeñare a bordo de una aeronave en vuelo actividades como tripulante de vuelo, será castigado con presidio o reclusión.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"cruce"},{"n":146,"s":"Excepto los vuelos que se efectúen sobre 3000 Ft AGL, las aeronaves no volarán en formación excepto mediante arreglo previo entre los pilotos al mando de las aeronaves participantes.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"cruce"},{"n":148,"s":"Se presentará un plan de vuelo a una oficina de notificación de los servicios de tránsito aéreo (ARO) (ya sea personalmente, por medio telefónico, correo electrónico o fax) antes de la salida, o se transmitirá durante el vuelo, a la dependencia de los servicios de tránsito aéreo o a la estación de radio de control aeroterrestre competente:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"cruce"},{"n":149,"s":"Se exceptúan de la presentación de un Plan de Vuelo:","o":[["A","Los vuelos VFR locales."],["B","Los vuelos VFR entre aeródromos que se encuentren ubicados dentro de los límites laterales de una Zona de Control."],["C","Todos los vuelos VFR."],["D","A y B son correctas."]],"a":"D","p":169,"src":"cruce"},{"n":151,"s":"El piloto al mando de la aeronave tiene autoridad decisiva en todo lo relacionado con ella, mientras esté al mando de la misma.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":170,"src":"cruce"},{"n":153,"s":"Se entenderá por abandonada una aeronave cuando concurran los siguientes requisitos:","o":[["A","Que se encuentre sin actividades de vuelo, por más de un año, en un aeródromo público."],["B","Que vencido el año, la autoridad aeronáutica notifique dicha circunstancia, por tres veces en el Diario Oficial, mediando a lo menos quince días entre cada aviso, indicando la matrícula de la aeronave, el nombre y domicilio del propietario y las hipotecas, privilegios, embargos u otros gravámenes que la afecten, según consten en el Registro Nacional de Aeronaves."],["C","Que transcurridos treinta días desde el último aviso, no se presente el propietario u otros interesados a resolver sobre el destino de la aeronave y a responder por los gastos o perjuicios que tal situación hubiere ocasionado. Vencido el plazo indicado en la letra c), la aeronave se perderá irrevocablemente para el dueño y para los demás titulares de derechos en ella, e ingresará al dominio fiscal com idencia."],["B","Angulo de ataque."],["C","Cuerda."],["D","Perfil aerodinámico."]],"a":"C","p":15,"src":"marca"},{"n":71,"s":"La tendencia del avión a girar hacia la izquierda alrededor del eje vertical, (durante el despegue) es producida por los desiguales ángulos de ataque de las palas ascendentes y descendentes de una hélice que gira, y se llama:","o":[["A","Precesión Giroscópica."],["B","Efecto Tirabuzón."],["C","Factor \"P\" o carga asimétrica de la hélice."],["D","Fuerza reactiva."]],"a":"C","p":15,"src":"marca"},{"n":72,"s":"Un avión que posee un factor límite de carga de 4.4g, su categoría será.","o":[["A","Normal."],["B","Utilitario."],["C","Acrobático."],["D","Ninguna de las anteriores."]],"a":"B","p":15,"src":"marca"},{"n":73,"s":"Cuáles son las \"Maniobras permitidas\" para una aeronave de categoría normal.","o":[["A","Cualquier maniobra relacionada con un vuelo normal."],["B","Stall (excepto Stall acelerado)."],["C","Ocho flojo, chandela, virajes escarpados (no más de 60 grados de inclinación)."],["D","Todas las anteriores."]],"a":"D","p":15,"src":"marca"},{"n":74,"s":"Cuando UD. inicia un viraje a la derecha, la resistencia es mayor en el ala........","o":[["A","Derecha."],["B","Izquierda."],["C","No existe diferencia."],["D","Ninguna es correcta."]],"a":"B","p":16,"src":"marca"},{"n":75,"s":"Cualquier superficie, tal como un ala de avión, diseñada para obtener una reacción, como la sustentación en el aire a través de la cual se desplaza, se llama:","o":[["A","Superficie alar."],["B","Envergadura de las alas."],["C","Perfil aerodinámico."],["D","Angulo de incidencia."]],"a":"C","p":16,"src":"marca"},{"n":76,"s":"La trayectoria misma de vuelo de un avión, determina la dirección del viento relativo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":16,"src":"marca"},{"n":77,"s":"Un avión puede entrar en stall en cualquier actitud de vuelo con respecto al horizonte, si el ángulo de ataque es aumentado más allá del ángulo de ataque critico.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":16,"src":"marca"},{"n":78,"s":"Durante el despegue no es necesario usar la máxima aceleración disponible (máxima potencia).","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":16,"src":"marca"},{"n":79,"s":"La fuerza involucrada en vencer la inercia y que se define, como un cambio de velocidad por unidad de tiempo se denomina:","o":[["A","Componente."],["B","Velocidad."],["C","Vectores."],["D","Aceleración."]],"a":"D","p":17,"src":"marca"},{"n":80,"s":"El ángulo agudo formado entre la línea de cuerda del ala y la dirección del viento relativo se denomina:","o":[["A","Angulo de incidencia."],["B","Angulo diedro."],["C","Vectores."],["D","Angulo de ataque."]],"a":"D","p":17,"src":"marca"},{"n":81,"s":"La dirección del flujo de aire producido por un objeto que se desplace a través de aire, se denomina:","o":[["A","Vectores."],["B","Viento relativo."],["C","Velocidad."],["D","Componente."]],"a":"B","p":17,"src":"marca"},{"n":82,"s":"La distancia recorrida en un cierto tiempo o la razón de movimiento en una cierta dirección se denomina:","o":[["A","Velocidad."],["B","Vectores."],["C","Componentes."],["D","Viento relativo."]],"a":"A","p":17,"src":"marca"},{"n":83,"s":"La superficie plana del ala, que incluye las superficies de control y puede incluir el área de ala cubierta por el fuselaje y las barquillas de los motores, se denomina:","o":[["A","Perfil aerodinámico."],["B","Capa limite."],["C","Superficie alar."],["D","Forma del ala."]],"a":"C","p":17,"src":"marca"},{"n":84,"s":"A medida que aumenta el ángulo de ataque de un ala:","o":[["A","La corriente de aire sobre la superficie superior es forzada a desplazarse más rápidamente, debido a la mayor distancia que recorre."],["B","La corriente de aire sobre la superficie es forzada a desplazarse mas lentamente, debido a la menor distancia que recorre."],["C","La corriente de aire sobre la superficie inferior es forzada a desplazarse más rápidamente, debido a la mayor distancia que recorre."],["D","B y C son correctas."]],"a":"A","p":18,"src":"marca"},{"n":85,"s":"A medida que se forma hielo sobre el perfil aerodinámico, especialmente en el borde de ataque, se rompe el flujo de aire sobre el ala. Este rompimiento del flujo de aire laminar causa que el ala pierda parte a toda la eficiencia de sustentación.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":18,"src":"marca"},{"n":86,"s":"¿Cuál es la razón principal por la cual es de extrema importancia que se remueve toda la escarcha, nieve y hielo del avión antes del despegue?","o":[["A","No existe ninguna razón principal."],["B","Para que los controles del avión estén libres y no se traben."],["C","Porque impide que exista la capa limite, que es la que permite que las líneas de flujo se mantenga adheridas al perfil."],["D","Porque se impide de esta manera el congelamiento de los líquidos."]],"a":"C","p":18,"src":"marca"},{"n":87,"s":"¿Qué ala produce más resistencia?","o":[["A","Ala cónica."],["B","Ala rectangular."]],"a":"B","p":18,"src":"marca"},{"n":88,"s":"Para lograr un patrón de stall deseable, se diseña un ala con una torsión, de manera que la punta tenga un ángulo de incidencia menor y por lo tanto, un ángulo de ataque menor cuando la raíz del ala se aproxime al ángulo de ataque critico.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":18,"src":"marca"},{"n":90,"s":"Las \"cuñas\" que se ubican en algunos aviones en el borde de ataque cerca de la raíz del ala, es un iniciador de stall.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":19,"src":"marca"},{"n":91,"s":"Torque es una fuerza, o combinación de fuerzas, que produce o tiende a producir un movimiento de torsión o de rotación de un avión.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":19,"src":"marca"},{"n":92,"s":"En avión con una hélice que gira en sentido de los punteros del reloj, mirado desde atrás, se produce una fuerza que tiende a girar todo el avión alrededor de su eje longitudinal en dirección contraria a los punteros del reloj, esto se denomina:","o":[["A","Efecto tirabuzón."],["B","Precesión Giroscópica."],["C","Fuerza reactiva."],["D","Facto \"P\"."]],"a":"C","p":19,"src":"marca"},{"n":93,"s":"Cuando la hélice del avión gira a través del aire en el sentido de los punteros del reloj, mirando desde atrás, el aspa de la hélice fuerza el aire hacia atrás en un flujo que jira en forma de espiral también en el sentido de los punteros del reloj alrededor del fuselaje. Esto se denomina","o":[["A","Efecto tirabuzón."],["B","Precesión giroscópica."],["C","Fuerza reactiva."],["D","Factor \"P\"."]],"a":"A","p":19,"src":"marca"},{"n":94,"s":"Para corregir el torque en un ascenso en la recta. UD. debe:","o":[["A","Presión sobre pedal izquierdo."],["B","Ala hacia la derecha."],["C","Presión sobre pedal derecho."],["D","No corrige ningún error."]],"a":"C","p":20,"src":"marca"},{"n":95,"s":"En un viraje, la fuerza centrifuga actúa hacia la parte.......de la curva.","o":[["A","Neutra."],["B","Interior."],["C","Exterior."],["D","Ninguna de las anteriores."]],"a":"C","p":20,"src":"marca"},{"n":96,"s":"Mientras un avión vuele en trayectoria de vuelo curva con una carga positiva, la carga que deben soportar las alas será igual al peso del avión mas la carga impuesta por la fuerza centrifuga.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":20,"src":"marca"},{"n":97,"s":"Cuando un avión se desplaza a velocidades menores que la de crucero, en un vuelo recto y nivelado, las fuerzas que actúan sobre él se separaran en componentes, que ocurre con la tracción.","o":[["A","La tracción continua paralela a la resistencia."],["B","La tracción tiene dos componentes, una perpendicular s la trayectoria de vuelo en la dirección de la sustentación y la otra actúa en el sentido de la trayectoria de vuelo."],["C","La tracción es igual al peso y opuesta a la resistencia."],["D","A y C son correctas."]],"a":"B","p":20,"src":"marca"},{"n":98,"s":"El avión cuando asciende lo hace exclusivamente debido al \"exceso de sustentación\".","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":20,"src":"marca"},{"n":99,"s":"Si la razón de planeo de un avión es 9/1, esto significa:","o":[["A","Que la sustentación es nueve veces mayor que la resistencia y un avión planeara 09 veces el equivalente a la altura que posee en ese momento."],["B","La sustentación es nueve veces menor que la resistencia."],["C","La resistencia es nueve veces menor que el vector resultante de tracción-peso."],["D","Ninguna de las anteriores es verdadera."]],"a":"D","p":21,"src":"marca"},{"n":100,"s":"Si el avión que está planeando, está volando a una velocidad justo por encima de la stall, este está operando con un ángulo de ataque máximo y por lo tanto máxima sustentación, esta situación produce el mayor ángulo de planeo, para lograr la mayor distancia de planeo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":21,"src":"marca"},{"n":101,"s":"En un planeo contra el viento a velocidad optima de planeo cubre....... distancia sobre la tierra, que, un planeo sin viento.","o":[["A","Mayor."],["B","Igual."],["C","Menor."],["D","Ninguna de las anteriores."]],"a":"C","p":21,"src":"marca"},{"n":102,"s":"¿Cuál es la razón de porque un avión es inclinado lateralmente para efectuar un viraje?","o":[["A","Debe ser inclinado lateralmente porque la misma fuerza (sustentación) que mantiene al avión en vuelo es utilizada para hacer virar el avión."],["B","El avión es inclinado lateralmente y se aplica presión hacia atrás al elevador esto cambia la dirección de la sustentación, este aumento de sustentación hace que el avión vire."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"C","p":21,"src":"marca"},{"n":103,"s":"En un viraje la fuerza de sustentación se puede descomponer en dos fuerzas, una vertical y otra horizontal, a que fuerzas se oponen ambas componentes?.","o":[["A","La componente vertical se opone a la fuerza centrípeta."],["B","La componente horizontal se opone a la fuerza de gravedad."],["C","La componente vertical se opone a la gravedad y la componente horizontal a la fuerza centrifuga."],["D","A y B son correctas."]],"a":"C","p":22,"src":"marca"},{"n":104,"s":"¿Qué efecto produce durante la carrera de aterrizaje subir flaps?","o":[["A","No produce ningún efecto favorable al aterrizaje."],["B","Aumenta la sustentación por la cual la distancia de aterrizaje aumentara considerablemente."],["C","Pierde efectividad los frenos."],["D","Disminuye el coeficiente de sustentación, aumentando la fuerza normal y la efectividad de los frenos."]],"a":"D","p":22,"src":"marca"},{"n":105,"s":"En las pistas situadas a gran altura todos los aviones necesitan una mayor longitud de pista que el nivel del mar , para aterrizar, esto se debe a que si los otros factores permanecen constantes, para mantener una determinada condición de vuelo, el avión necesita mayor velocidad para compensar la menor densidad del aire.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":22,"src":"marca"},{"n":107,"s":"La fuerza que produce el motor al girar la hélice se llama factor P.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":22,"src":"marca"},{"n":108,"s":"En un aterrizaje con cero viento, las alas deben permanecer niveladas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":23,"src":"marca"},{"n":109,"s":"Ud., está planeando sin motor y su velocidad de planeo disminuye bajo lo normal, entonces UD., debe:","o":[["A","Ajustarse a la nueva velocidad."],["B","Bastón adelante y establecer la velocidad de planeo del avión."],["C","Bastón atrás y establecer la velocidad de planeo del avión."],["D","Ninguna de las anteriores."]],"a":"B","p":23,"src":"marca"},{"n":110,"s":"En un descenso a velocidad constante la razón de descenso.......... cuando se disminuye la potencia","o":[["A","Disminuye."],["B","Aumenta."],["C","Se mantiene."],["D","Ninguna de las anteriores."]],"a":"B","p":23,"src":"marca"},{"n":112,"s":"Si UD., aterriza con viento cruzado desde la derecha, el ala ..............debe mantenerla abajo.","o":[["A","Izquierda."],["B","Derecha."]],"a":"B","p":23,"src":"marca"},{"n":113,"s":"La fuerza que se opone al movimiento hacia adelante del avión a través del aire, se denomina:","o":[["A","Tracción."],["B","Resistencia."],["C","Gravedad."],["D","Ninguna de las anteriores."]],"a":"B","p":23,"src":"marca"},{"n":114,"s":"¿Cuál es la técnica correcta en el uso de los frenos?:","o":[["A","Aplicar frenos solo una vez que el avión haya disminuido algo su velocidad."],["B","Aplicarlos en forma continua y progresiva hasta que las ruedas empiecen a disminuir su capacidad de rotación."],["C","A menor velocidad aumentar la presión sobre los frenos."],["D","Todas las anteriores son correctas."]],"a":"D","p":24,"src":"marca"},{"n":115,"s":"Los dispositivos que destruyen la sustentación alar durante el aterrizaje se llaman:","o":[["A","Slats."],["B","Spoilers."],["C","Alerones."],["D","Generadores de vórtice."]],"a":"B","p":24,"src":"marca"},{"n":116,"s":"Un caso extremadamente peligroso tanto para el despegue como el aterrizaje, es el denominado efecto hidroplaneo, ¿qué sucede?:","o":[["A","Disminuye la fricción con la pista por la presencia de hielo."],["B","Aumenta la fricción con la pista por el efecto de la lluvia (humedad)."],["C","El exceso de agua en la pista produce este efecto, al formarse una película de agua o hielo entre la pista y las ruedas lo que produce una pérdida de control direccional y frenos del avión."],["D","Todas las anteriores son correctas."]],"a":"C","p":24,"src":"marca"},{"n":117,"s":"¿Qué factores afectan al aterrizaje?","o":[["A","Peso-viento-velocidad-fricción."],["B","Peso- viento-velocidad-tipo de pista-tiempo."],["C","Peso-viento-velocidad-tipo de pista-elevación de pista."],["D","Peso-viento-velocidad-tracción-fricción."]],"a":"C","p":24,"src":"marca"},{"n":119,"s":"El más común y peligroso error en el aterrizaje, es no mantener y por el contrario, disminuir la velocidad de aproximación en final. Esta condición en si es peligrosa porque:","o":[["A","El ángulo de planeo o descenso aumenta."],["B","Implica un gran aumento del ángulo de ataque y el peligro consecuente de un stall a bajo altura, con tren y flaps abajo."],["C","No es peligroso estando consciente de lo que está haciendo."],["D","A y B son correctas."]],"a":"D","p":25,"src":"marca"},{"n":120,"s":"¿Cuándo un stall se convierte en spin?","o":[["A","Inmediatamente después de producirse el stall."],["B","Cuando el piloto no toma una acción correctiva y permite que el stall progrese."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":25,"src":"marca"},{"n":121,"s":"Inmediatamente después del despegue UD., puede efectuar virajes escarpados, ya que el avión está volando sin problemas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":25,"src":"marca"},{"n":122,"s":"Al sobrepasar excesivamente la velocidad de despegue del avión, sin levantarlo de la pista cual es el resultado?","o":[["A","Gran longitud de pista requerida para el despegue."],["B","Neumáticos de avión resultan sometidos a esfuerzos críticos que pueden ocasionarles daños, fallas o rupturas."],["C","Despegue con mayor seguridad."],["D","A y B son correctas."]],"a":"D","p":25,"src":"marca"},{"n":123,"s":"Durante la carrera de despegue UD., puede usar los 100% flaps extendidos ya que su total deflexión aumenta considerablemente al coeficiente de sustentación y reduce la aceleración durante la carrera de despegue.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":25,"src":"marca"},{"n":124,"s":"En general nunca se deberá usar más del 50% de la deflexión total de los flaps si se desea acortar la distancia de despegue.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":26,"src":"marca"},{"n":125,"s":"Una buena aproximación final es aquella que se efectúa con el ángulo de planeo establecido, con la velocidad exacta y con potencia reducida.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":26,"src":"marca"},{"n":126,"s":"Al oprimir el pedal derecho del avión, el timón es deflectado hacia la ..........lo que causa que el viento relativo deflecte la cola hacia la .......... y la nariz hacia la..........","o":[["A","Derecha - Izquierda - Derecha."],["B","Izquierda - Derecha - Izquierda."],["C","Izquierda - Derecha - Derecha."],["D","Derecha. Izquierda . Izquierda."]],"a":"A","p":26,"src":"marca"},{"n":127,"s":"Si UD. va en aproximación final, bajo la velocidad de aterrizaje del avión, con un alto ángulo de ataque y sube flaps, ¿qué sucede?.","o":[["A","Aumenta la velocidad y disminuye el ángulo de ataque lo que le permitiría volver a los parámetros normales en la aproximación."],["B","Aumentara la sustentación."],["C","Tiene en progreso un stall seguro."],["D","Ninguna de las anteriores."]],"a":"C","p":26,"src":"marca"},{"n":128,"s":"Dos aviones que tienen la misma relación sustentación resistencia, pero pesos diferentes, comienzan un planeo desde la misma altitud, ¿qué sucede?:","o":[["A","El avión más liviano llega primero a tierra y cubre mayor distancia, planeando a mayor velocidad."],["B","El avión más pesado llega primero y cubre menor distancia, planeando a menor velocidad."],["C","El avión más liviano llega último a tierra y cubre mayor distancia, planeando a velocidad indicada."],["D","El avión más pesado llega primero a tierra a mayor velocidad pero cubre la misma distancia en el planeo."]],"a":"C","p":27,"src":"marca"},{"n":129,"s":"Si UD. duplica el área del ala, permaneciendo iguales otras variables, ¿qué sucede con la sustentación y la resistencia?","o":[["A","Se triplicarán."],["B","Se cuadriplicarán."],["C","Se duplicarán."],["D","Ninguna de las anteriores."]],"a":"C","p":27,"src":"marca"},{"n":130,"s":"Se obtiene el control lateral por medio del uso de :","o":[["A","Pedales."],["B","Alerones."],["C","Timón de profundidad."],["D","Ninguna de las anteriores."]],"a":"A","p":27,"src":"marca"},{"n":131,"s":"La combinación motor-hélice está diseñado para producir tracción para vencer la resistencia, el ala está diseñada para producir sustentación para vencer el peso (o gravedad).","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":27,"src":"marca"},{"n":132,"s":"De acuerdo al principio de Bernoulli, podemos deducir que el aire que fluye en un Ala ................., tendrá ...............","o":[["A","A mayor velocidad, menos presión."],["B","A menor velocidad, mayor presión."],["C","A y B son correctas."],["D","Ninguna es correcta."]],"a":"C","p":27,"src":"marca"}]},{"name":"FISIOLOGIA PP AVION","q":[{"n":1,"s":"¿Cuáles son las fuerzas que actúan sobre la masa atmosférica?","o":[["A","Radiación solar - Fuerza gravitacional."],["B","Radiación lunar- Fuerza gravitacional."],["C","Fuerza gravitacional- Fuerza centrifuga."],["D","Fuerza centrifuga-Fuerza centrípeta."]],"a":"C","p":28,"src":"marca"},{"n":2,"s":"La zona en la cual el organismo humano no puede sobrevivir en forma de indefinida sin un aporte extraordinario de oxígeno va de :","o":[["A","8.000 a 50.000 pies."],["B","10.000 a 50.000 pies."],["C","12.000 a 50.000 pies."],["D","15.000 a 50.000 pies."]],"a":"D","p":28,"src":"marca"},{"n":4,"s":"Las características más peligrosas de la hipoxia son que no produce dolor o malestar significativo, pasando desapercibida su presencia hasta provocar la incapacidad del individuo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":28,"src":"marca"},{"n":5,"s":"¿Cuál es el signo, bajo 10.000 pies que puede señalar la presencia de hipoxia?","o":[["A","Mareos."],["B","falta de aire."],["C","Disminución de la visión nocturna."],["D","Fatiga."]],"a":"D","p":29,"src":"marca"},{"n":6,"s":"El estado de deficiencia de oxigeno en la sangre, células y tejidos del organismo, con compromiso de la función de estos elementos, se denomina Hipoxia.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":29,"src":"marca"},{"n":7,"s":"La hipoxia que afecta la fase ventilatoria de la respiración y se presenta cuando exista una deficiencia en la cantidad de oxigeno entregada a los capilares pulmonares se denomina:","o":[["A","Hipoxia hipémica."],["B","Hipoxia histotóxica."],["C","Hipoxia hipóxica."],["D","Hipoxia por estagnación."]],"a":"C","p":29,"src":"marca"},{"n":8,"s":"¿Cuáles son las causas de la hipoxia hipóxica?","o":[["A","Exposición a altitud, perdida de la presurización de cabina."],["B","Mal funcionamiento del equipo de oxigeno, afecciones del pulmón."],["C","Insuficiencia cardiaca, shock."],["D","A y B son verdaderas."]],"a":"D","p":29,"src":"marca"},{"n":9,"s":"Los órganos del equilibrio están constituidos por : la visión, el aparato vestibular y el sistema somatosensorial.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":29,"src":"marca"},{"n":10,"s":"Las causas más frecuentes de hipoxia hipémica son:","o":[["A","Intoxicación por monóxido de carbono, pedida de sangre, tabaquismo."],["B","Intoxicación por cianuro, por alcohol."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"C","p":30,"src":"marca"},{"n":11,"s":"La hipoxia por estagnación es la que afecta la fase de utilización de la respiración y consiste en la incapacidad de las células para utilizar el oxigeno en forma adecuada.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":30,"src":"marca"},{"n":12,"s":"Las causas más frecuentes de hipoxia por estagnación son:","o":[["A","Insuficiencia cardiaca, shock."],["B","respiración a presión positiva continuada."],["C","Frío extremo, aplicación de fuerzas G positivas"],["D","Todas las anteriores son verdaderas."]],"a":"D","p":30,"src":"marca"},{"n":13,"s":"Las causas más frecuentes de hipoxia histotóxica son:","o":[["A","Intoxicación por cianatos o alcohol."],["B","Intoxicación por monóxido de carbono."],["C","Tabaquismo."],["D","A y B son correctas."]],"a":"D","p":30,"src":"marca"},{"n":14,"s":"La severidad de los síntomas de hipoxia varía en forma individual y de acuerdo a la deficiencia misma de oxígeno.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":30,"src":"marca"},{"n":15,"s":"La susceptibilidad a la hipoxia se ve afectada por factores tales como:","o":[["A","Altitud."],["B","Cantidad de glóbulos rojos."],["C","Estado físico."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":30,"src":"marca"},{"n":16,"s":"El compromiso de las funciones intelectuales, es un signo precoz de la presencia de hipoxia, que compromete lógicamente la capacidad de piloto para darse cuenta de su propia incapacitación.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":31,"src":"marca"},{"n":17,"s":"Cuando UD. tiene compromiso de las funciones intelectuales, a causa de la presencia de hipoxia, existe compromiso del pensamiento, que se hace más lento, el cálculo es impreciso, el juicio pobre, la memoria incierta y el tiempo de reacción se retarda considerablemente.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":31,"src":"marca"},{"n":18,"s":"El intervalo entre la interrupción del aporte de oxigeno o exposición a un ambiente pobre en oxigeno, hasta el momento en que el piloto pierde la capacidad para tomar acciones protectoras o correctivas, se denomina: \"Tiempo útil de conciencia\".","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":31,"src":"marca"},{"n":20,"s":"¿Cuáles son los síntomas objetivos para reconocer la hipoxia, que no son percibidos por el piloto?","o":[["A","Aumento en la profundidad de la respiración, cianosis, confusión mental, pobreza de juicio."],["B","Pérdida de la coordinación muscular, inconsciencia"],["C","Sensación de falta de aire, sensación de temor, cefalea, mareo, fatiga, nausea."],["D","A y B son correctas."]],"a":"D","p":31,"src":"marca"},{"n":21,"s":"Los síntomas subjetivos para reconocer la hipoxia y que son las señales de alarma más importante para el piloto son:","o":[["A","Sensación de falta de aire, sensación de temor, cefalea, mareo, fatiga, nausea, sensación de ondas de Frío, visión borrosa, visión de túnel, parestesias."],["B","Confusión mental, pobreza de juicio, pérdida de la coordinación muscular, cianosis."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"D","p":32,"src":"marca"},{"n":22,"s":"¿Qué factores influyen en la hipoxia?","o":[["A","Altitud -razón de ascenso-tiempo de exposición."],["B","Estado físico-actividad física."],["C","Tolerancia individual-factores sicológicos- temperaturas ambiente."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":32,"src":"marca"},{"n":23,"s":"Las personas con rasgos neuróticos presentan habitualmente una menor tolerancia a la hipoxia.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":32,"src":"marca"},{"n":24,"s":"La altura afecta directamente la presión parcial de oxígeno del aire inspirado y disminuye la presión parcial alveolar de oxigeno.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":32,"src":"marca"},{"n":25,"s":"La descompensación gaseosa de la atmósfera se mantiene constante hasta una altura aproximada de:","o":[["A","20 millas."],["B","40 millas."],["C","60 millas."],["D","80 millas."]],"a":"A","p":32,"src":"marca"},{"n":26,"s":"Mediante la cámara altimática, se permite al piloto experimentar sus propios síntomas de hipoxia de una manera controlada y segura, reconocerlos y tenerlos en cuenta ya que estos no varían mayormente con el tiempo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":33,"src":"marca"},{"n":27,"s":"Ud., va volando a 18.000 pies y sufre síntomas de hipoxia, después de tomar todas las medidas relacionadas con el oxígeno, Ud., se da cuenta que los síntomas continúan, ¿Qué debe hacer?","o":[["A","Chequear y controlar el ritmo de respiración, que no vaya a estar elevado por la presencia de miedo o ansiedad y que pueden llevarlo a una hiperventilación."],["B","Descender bajo 10.000 pies, con el objeto de aumentar la presión parcial de oxigeno en el alveolo pulmonar."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":33,"src":"marca"},{"n":28,"s":"La forma más efectiva de controlar la hiperventilación es controlar la respiración disminuyendo la frecuencia y profundidad de ésta.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":33,"src":"marca"},{"n":29,"s":"La frecuencia respiratoria normal es de:","o":[["A","8 a 10 ciclos por minuto."],["B","10 a 12 ciclos por minuto."],["C","12 a 16 ciclos por minuto."],["D","14 a 18 ciclos por minuto."]],"a":"B","p":33,"src":"marca"},{"n":30,"s":"El ritmo respiratorio puede ser controlado dentro de ciertos límites, tanto en frecuencia y profundidad de sus movimientos respiratorios.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":33,"src":"marca"},{"n":31,"s":"¿Cuáles son las causas de hiperventilación?","o":[["A","Voluntaria - Emocional."],["B","Dolor."],["C","Hipoxia."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":34,"src":"marca"},{"n":32,"s":"¿Cuáles son los efectos de la hiperventilación?","o":[["A","Irritabilidad neuromuscular."],["B","Respuesta vascular."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"C","p":34,"src":"marca"},{"n":33,"s":"Los síntomas subjetivos de hiperventilación son: cianosis, confusión mental, pobreza de juicio.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":34,"src":"marca"},{"n":34,"s":"Los síntomas de la hiperventilación y los de la hipoxia son:","o":[["A","Distintos."],["B","Similares."],["C","Opuestos."],["D","Idénticos."]],"a":"B","p":34,"src":"marca"},{"n":35,"s":"¿Cuáles son los cuadros clínicos que se pueden presentar por el efecto mecánico de la variación de volumen de los gases atrapados?","o":[["A","Expansión de gases gastro intestinales-barotitis media."],["B","Barosinusitis-barodontalgia."],["C","Sobre distensión pulmonar."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":34,"src":"marca"},{"n":36,"s":"Un buzo al descender bajo el agua se ...........un piloto al descender nuevamente a la superficie se......................","o":[["A","Comprime - recomprime."],["B","Descomprime - comprime."],["C","Descomprime - descomprime."],["D","Comprime- descomprime."]],"a":"A","p":35,"src":"marca"},{"n":37,"s":"La expansión de gases gastro intestinales en los pilotos comienzan a notarse sobre................... y son habituales sobre...............","o":[["A","FL 50 - FL 200."],["B","FL 150 - FL 300."],["C","FL 100 - FL 250."],["D","FL 150 - FL 250."]],"a":"C","p":35,"src":"marca"},{"n":38,"s":"¿Qué consecuencias puede llegar a tener la expansión de gases gastro intestinales?","o":[["A","Ninguna."],["B","Sólo leves dolores."],["C","Dolor de tipo cólico intestinal."],["D","Ninguna de las anteriores."]],"a":"C","p":35,"src":"marca"},{"n":39,"s":"Durante el ascenso UD. se da cuenta que tiene molestias en el oído, debido a que no se ha equilibrado la presión transtimpánica, ¿qué debe hacer?","o":[["A","Taparse los oídos."],["B","Bostezar o tragar saliva,"],["C","Soplar con nariz y boca tapadas."],["D","Ninguna de las anteriores."]],"a":"B","p":35,"src":"marca"},{"n":40,"s":"La barotitis media se produce con mayor frecuencia e intensidad durante el:","o":[["A","Ascenso."],["B","Ascenso o Descenso."],["C","Descenso."],["D","Invierno."]],"a":"A","p":35,"src":"marca"},{"n":41,"s":"La barodontalgia se produce en ocasiones, en obturaciones dentales que pueden tener una burbuja de aire en su interior, la que al expandirse puede comprimir el nervio sensitivo produciendo dolor.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":36,"src":"marca"},{"n":42,"s":"En una decomprensión rápida o decomprensión explosiva en la que el exceso de volumen gaseoso del pulmón no logra salir en forma oportuna a través de la traquea por limitación de flujo, el único cuadro clínico que reviste gravedad es el de:","o":[["A","Sobredistención pulmonar."],["B","Neumotórax pulmonar."],["C","Mediastino pulmonar."],["D","Neumomediastino pulmonar."]],"a":"A","p":36,"src":"marca"},{"n":43,"s":"Al efectuar vuelos nocturnos se debe considerar, en relación a la visión diurna, que:","o":[["A","La visión nocturna es deficiente en agudeza y no capta colores ni detalles."],["B","La visión nocturna carece de percepción de profundidad."],["C","La visión nocturna no permite la diferenciación de los rojos y azules."],["D","A y B son correctas."]],"a":"D","p":36,"src":"marca"},{"n":44,"s":"Con la finalidad de adaptarse a la visión nocturna, un piloto debe completar....................minutos en la cabina con luces al mínimo o en un ambiente iluminado con luz roja, o usando gafas rojas cuando la luz ambiente es blanca.","o":[["A","10 minutos."],["B","15 minutos."],["C","20 minutos."],["D","30 minutos."]],"a":"D","p":36,"src":"marca"},{"n":45,"s":"El proceso de adaptación a la oscuridad se debe efectuar con ambos ojos cerrados ya que el proceso de adaptación no es independiente para cada ojo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":36,"src":"marca"},{"n":46,"s":"Se puede decir que la agudeza visual para visualizar un objeto depende, entre otros, de:","o":[["A","Tamaño, cantidad y dirección de la iluminación."],["B","Tiempo dedicado a buscar el objeto, grado de adaptación de la retina. Condición atmosférica interpuesta, superficies ópticas interpuestas, contraste con el fondo."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":37,"src":"marca"},{"n":47,"s":"Dentro de las medidas para asegurar una mejor agudeza visual tenemos:","o":[["A","Mirar directa y fijamente el objeto."],["B","Barrer el horizonte con la mirada."],["C","Mirar el objeto en forma fija por tiempo indefinido."],["D","Todas las anteriores son falsas."]],"a":"D","p":37,"src":"marca"},{"n":48,"s":"Si un objeto es superpuesto por otro, se deduce que:","o":[["A","Estará más cerca."],["B","Van a colisionar."],["C","Esta más alejado."],["D","Ninguna de las anteriores."]],"a":"C","p":37,"src":"marca"},{"n":49,"s":"Las ilusiones visuales son comunes durante............debido a la ................y a la falta de referencias adecuadas.","o":[["A","El día - mala agudeza visual."],["B","La noche- buena agudeza visual."],["C","El día - buena agudeza visual."],["D","La noche - mala agudeza visual."]],"a":"D","p":37,"src":"marca"},{"n":50,"s":"Un trastorno visual transitorio provocado por la exposición repentina a una intensidad de luz mayor, a la que el ojo esta adaptado, se denomina:","o":[["A","Deslumbramiento."],["B","Ceguera."],["C","Pérdida de visión."],["D","Pérdida de conocimiento."]],"a":"A","p":37,"src":"marca"},{"n":51,"s":"El tiempo de la recuperación de un encandilamiento puede demorar desde algunos segundos hasta............","o":[["A","30 segundos y 1 minuto."],["B","45 segundos y 1 minutos"],["C","1 minuto y 2 minutos."],["D","2 minutos y 3 minutos."]],"a":"A","p":38,"src":"marca"},{"n":52,"s":"Si Ud. mira fijo una luz sobre fondo oscuro, parece moverse debido al movimiento constante e imperceptible de la pupila y/o del ojo. Esto se denomina:","o":[["A","Movimiento relativo."],["B","Confusión de luces."],["C","Fenómeno autoquinético."],["D","Falsas imágenes exteriores."]],"a":"C","p":38,"src":"marca"},{"n":53,"s":"La sensación de movimiento o aceleración, que se tiene cuando es el objeto contiguo el que se está moviendo o variando su velocidad, se denomina:","o":[["A","Movimiento relativo."],["B","confusión de luces."],["C","Fenómeno autoquinético."],["D","Falsas imagines exteriores."]],"a":"A","p":38,"src":"marca"},{"n":54,"s":"Cuando se vuela sin la referencia del horizonte terrestre, cualquier plano inclinado (nubes, montañas) pueden ser interpretadas como horizonte y el piloto se guiará según él, esto se denomina:","o":[["A","Movimiento relativo."],["B","Horizontes falsos."],["C","Fenómeno autoquinético."],["D","Falsas imágenes exteriores."]],"a":"B","p":38,"src":"marca"},{"n":55,"s":"La desorientación espacial es la incapacidad de un piloto para orientarse con respecto al medio ambiente o al horizonte.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":38,"src":"marca"},{"n":56,"s":"Entre las sugerencias practicas para facilitar la adaptación a la oscuridad podemos señalar entre otras:","o":[["A","Consumir vitamina A en la dieta."],["B","Evitar la exposición prolongada a la luz intensa."],["C","A y B son correctas."],["D","Ninguna de las anteriores."]],"a":"C","p":39,"src":"marca"},{"n":57,"s":"Las acciones a realizar ante la presencia de desorientación espacial son entre otras:","o":[["A","Referirse a los instrumentos que son la clave para superar el problema y dar credibilidad a la información que entregan."],["B","Disminuir al máximo los movimientos de cabeza."],["C","Alcanzar el vuelo recto y nivelado y evitar cualquier maniobra hasta la total recuperación de falsas sensaciones."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":39,"src":"marca"},{"n":58,"s":"El órgano del equilibrio, que es el sentido capital en la orientación y equilibrio, tanto, que puede mantener estas funciones ante la ausencia de los otros órganos del equilibrio es :","o":[["A","El aparato vestibular."],["B","El aparato somatosensorial."],["C","La visión"],["D","Ninguna de las anteriores"]],"a":"C","p":39,"src":"marca"},{"n":59,"s":"Los canales semicirculares contienen un líquido (linfa) que se mueve dentro del canal. El movimiento de este líquido se transmite a unos cilios implantados en el interior del canal los que envían los estímulos recibidos a través del nervio vestibular al cerebro. Estos impulsos son interpretados como cambios en la posición o actitud.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":39,"src":"marca"},{"n":60,"s":"Cuando un canal semicircular es acelerado hacia la izquierda, el líquido en el canal inclina a los cilios hacia la ........... y el cerebro interpreta esta inclinación como movimiento angular hacia la .........................","o":[["A","Izquierda - izquierda."],["B","Derecha - izquierda."],["C","Derecha - derecha."],["D","Izquierda - derecha."]],"a":"B","p":40,"src":"marca"},{"n":61,"s":"La diferencia entre la presión interior de la cabina y la presión atmosférica se denomina \"presión diferencial\".","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":40,"src":"marca"},{"n":62,"s":"Durante el proceso de aceleración se produce dos fuerzas de sentido opuesto, la fuerza acelerativa y su oponente la fuerza inercial.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":40,"src":"marca"},{"n":63,"s":"Si una aeronave está expuesta a una aceleración, que produce una fuerza inercial que, se aplica desde la cabeza a los pies del piloto, esta fuerza se denomina \"G\" positiva.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":40,"src":"marca"},{"n":64,"s":"Al bajar la nariz del avión al iniciar un descenso, estamos aplicando \"G\" positivas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":40,"src":"marca"},{"n":65,"s":"Un piloto que pesa 70 kilos a 1G, pesará.............kilos si está expuesto a 4G.","o":[["A","70 kilos."],["B","140 kilos."],["C","210 kilos."],["D","280 kilos."]],"a":"D","p":40,"src":"marca"},{"n":66,"s":"La aceleración, que produce afecto de fuerza inercial en el piloto desde la parte anterior del tronco hacia la espalda, se denomina:","o":[["A","\"G\" positiva."],["B","G negativa."],["C","G transversal."],["D","Ninguna de las anteriores."]],"a":"C","p":41,"src":"marca"},{"n":67,"s":"Los efectos fisiológicos de la aceleración de acuerdo a su duración, podemos determinar que un piloto expuesto a 14 \"G\" positivas por una fracción de segundos tendrá más efectos fisiológicos que un piloto expuesto por más de 2 segundos a 9 \"G\" positivas.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":41,"src":"marca"},{"n":68,"s":"¿Cuál es el principal efecto al aplicar fuerzas \"G\" positivas?","o":[["A","Perdida de la visión"],["B","Perdida de conocimiento"],["C","Sensación de aumento de peso con la resultante de disminución de la movilidad corporal"],["D","No hay efectos"]],"a":"C","p":41,"src":"marca"},{"n":69,"s":"Si Ud. aumenta la magnitud y la duración de la fuerza \"G\" positiva aplicada ¿qué sucede?.","o":[["A","Empieza a tener efecto sobre la visión."],["B","Empieza a tener efecto sobre el sistema nervioso central."],[
