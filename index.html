 y se debe controlar que se efectúen las anotaciones correspondientes en los registros y bitácoras del avión cuando se efectúen reparaciones o modificaciones.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":131,"src":"marca"},{"n":11,"s":"La distancia horizontal en pulgadas desde la línea de referencia (Datum) hasta el centro de gravedad de un ítem, se denomina:","o":[["A","Estación."],["B","Centro de Gravedad."],["C","Brazo."],["D","Momento."]],"a":"C","p":131,"src":"marca"},{"n":12,"s":"La distancia entre los limites delantero y trasero del C.G. indicados en las especificaciones pertinentes del avión, se denomina:","o":[["A","Rango del centro de gravedad."],["B","línea de referencia."],["C","Limites del centro de gravedad."],["D","Ninguna de las anteriores."]],"a":"A","p":131,"src":"marca"},{"n":13,"s":"El plano vertical imaginario o línea desde la cual se toman las mediciones del brazo, se denomina:","o":[["A","Momento."],["B","línea de referencia."],["C","Estación."],["D","Cuerda aerodinámica."]],"a":"B","p":131,"src":"marca"},{"n":30,"s":"El sobrepeso reduce las performance de vuelo del avión en casi todos sus aspectos. Las deficiencias más importantes de un avión sobrecargado son:","o":[["A","Mayor velocidad y carrera de despegue-mayor velocidad y carrera de aterrizaje-mayor velocidad de stall."],["B","Razón y ángulo de ascenso reducidos-menor altitud máxima y alcance."],["C","Velocidad de crucero reducida-maniobrabilidad reducida-peso excesivo en la rueda de nariz."],["D","Todas las anteriores son correctas."]],"a":"D","p":136,"src":"marca"},{"n":31,"s":"El peso vacío de un avión incluye:","o":[["A","Estructuras-motores y todos los ítem de equipo operacional que tengan ubicaciones fijas y que estén instalados permanentemente en el avión."],["B","Equipo opcional y especial-lastre fijo fluido hidráulico."],["C","Combustible no utilizable (residuo y aceite no drenable (residuo)."],["D","Todas las anteriores son correctas."]],"a":"D","p":136,"src":"marca"}]},{"name":"REGLAMENTACION PP AVION","q":[{"n":1,"s":"El procedimiento de falla de comunicaciones, para aeronaves operando en condiciones meteorológicas visuales es:","o":[["A","Proseguirá su vuelo en condiciones meteorológicas de vuelo visual."],["B","Aterrizará en el aeródromo adecuado más próximo."],["C","Notificará su llegada, por el medio más rápido, a la dependencia apropiada del control de tránsito aéreo."],["D","A, B y C son correctas."]],"a":"D","p":137,"src":"marca"},{"n":2,"s":"Toda aeronave civil que sobrevuele zonas prohibidas y restringidas sin autorización, puede ser interceptada y guiada fuera de estas zonas o puede recibir instrucciones para que aterrice en un aeródromo designado.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":137,"src":"marca"},{"n":4,"s":"Cuando dos o más aerodinos se aproximen a un aeródromo para aterrizar, cederá el paso:","o":[["A","El que esté a menor nivel."],["B","El que esté a mayor nivel."],["C","El que esté a la derecha."],["D","El que esté en aproximación final."]],"a":"B","p":137,"src":"marca"},{"n":5,"s":"El piloto al mando de toda aeronave que esté siendo objeto de actos de interferencia ilícita debe hacer lo posible por notificar a la dependencia ATS pertinente este hecho, dejando como última opción el aterrizaje de la aeronave, a fin de recurrir de inmediato a los procedimientos de interceptación de aeronaves civiles.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":138,"src":"marca"},{"n":8,"s":"Una aeronave, apagando y encendiendo sucesivamente los faros de aterrizaje, está indicando una señal de peligro grave e inminente y pide ayuda inmediata.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":138,"src":"marca"},{"n":9,"s":"Los vuelos VFR no se deben efectuar:","o":[["A","Sobre aglomeraciones de edificios en ciudades, pueblos o lugares habitados, o sobre una reunión de personas al aire libre a una altura menor de 300 metros (1.000 pies) sobre el obstáculo más alto situado dentro de un radio de 600 metros (2.000 pies) desde la aeronave."],["B","En cualquier otra parte distinta de la especificada anteriormente, a una altura de 150 metros (500 pies) sobre tierra o agua."],["C","A alturas menores antes señaladas, excepto cuando sea necesario para el despegue o el aterrizaje, o cuando se tenga permiso de la autoridad aeronáutica."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":139,"src":"marca"},{"n":11,"s":"La señal de serie de destellos rojos emitida desde la dependencia del servicio de control de aeródromo (TWR) a las aeronaves en tierra, significa:","o":[["A","Aeródromo peligroso."],["B","Aterrice en este Aeródromo."],["C","Apártese del área de aterrizaje en uso."],["D","Regrese al punto de partida."]],"a":"C","p":139,"src":"marca"},{"n":12,"s":"Área definida, en un aeródromo terrestre, destinada a dar cabida a las aeronaves, para los fines de embarque o desembarque de pasajeros, correo o carga, abastecimiento de combustible, estacionamiento o mantenimiento, se denomina:","o":[["A","Estación aeronáutica."],["B","Plataforma."],["C","Calles de rodaje."],["D","Área de maniobras."]],"a":"B","p":139,"src":"marca"},{"n":13,"s":"Cuando dos aeronaves se aproximen de frente o casi de frente, y haya peligro de colisión, ambas aeronaves deben alterar su rumbo hacia la:","o":[["A","Izquierda."],["B","No alterarán su rumbo."],["C","Derecha."],["D","Ninguna de las anteriores."]],"a":"C","p":140,"src":"marca"},{"n":14,"s":"La ubicación y color de las luces de navegación son: Punta de Ala Izquierda Verde, a la derecha Roja y color Blanca.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":140,"src":"marca"},{"n":15,"s":"Cuando se sepa que los medios de comunicación en el aeródromo de llegada son inadecuados y no se disponga en tierra de otros medios para el despacho de mensajes de llegada, la aeronave transmitirá a la dependencia de servicios de tránsito aéreo apropiada inmediatamente antes de aterrizar, si es posible, un mensaje similar al de un informe de llegada, que contenga:","o":[["A","Información de un próximo vuelo."],["B","Ud. no transmitirá ningún mensaje, ya que la autoridad ATS al transcurrir el tiempo de vuelo programado, cancelara su plan de vuelo porque sabe que no puede comunicarse."],["C","Identificación de la aeronave; Aeródromo de salida; Aeródromo de destino (solamente si el aterrizaje no se efectuó en el aeródromo de destino); Aeródromo de llegada y Hora de llegada."],["D","Todas las anteriores son falsas."]],"a":"C","p":140,"src":"marca"},{"n":16,"s":"Un panel cuadrado, rojo y horizontal, con una diagonal amarilla, cuando esté colocado en un área de señales, indica que:","o":[["A","Está prohibido aterrizar."],["B","Debido al mal estado del área de maniobras o por cualquier otra razón, deben tomarse precauciones especiales durante la aproximación para aterrizar, o durante el aterrizaje."],["C","Autoriza sólo el uso de pistas y de calles de rodaje."],["D","Las pistas o calles de rodaje están cerradas al tránsito."]],"a":"B","p":140,"src":"marca"},{"n":17,"s":"¿Cuál es la sigla que se utiliza para identificar el servicio de información de vuelo de aeródromo?","o":[["A","ATIS."],["B","ATS."],["C","ARO."],["D","AFIS."]],"a":"D","p":141,"src":"marca"},{"n":18,"s":"Persona encargada de la operación, mando y funcionamiento de la aeronave o sus partes que cumple funciones esenciales, durante el período de servicio de vuelo, se denomina a:","o":[["A","Miembro de la tripulación."],["B","Piloto."],["C","Miembro de la tripulación de vuelo."],["D","Ninguna de las anteriores."]],"a":"D","p":141,"src":"marca"},{"n":19,"s":"Cuando un baroaltímetro de tipo de presión, calibrado de acuerdo con la atmósfera tipo, se ajuste a la presión de 1013.2 hPa o 29,92 Pulgadas de Hg, podrá usarse para indicar:","o":[["A","Altura."],["B","Altitud."],["C","Nivel de Vuelo."],["D","Elevación."]],"a":"C","p":141,"src":"marca"},{"n":20,"s":"¿Cuándo se considera que una aeronave está en las inmediaciones de un aeródromo?","o":[["A","Cuando está operando dentro de una zona instrucción conocida."],["B","Cuando está dentro de un circuito de tránsito de aeródromo, o bien entrando o saliendo del mismo."],["C","A y B son verdaderas."],["D","A y B son falsas."]],"a":"B","p":141,"src":"marca"},{"n":21,"s":"Espacio Aéreo de dimensiones definidas en el cual puede desplegarse en determinados momentos actividades peligrosas para el vuelo de las aeronaves, se denomina:","o":[["A","Zona prohibida."],["B","Zona restringida."],["C","Zona peligrosa."],["D","Ninguna de las anteriores."]],"a":"C","p":142,"src":"marca"},{"n":22,"s":"¿Quiénes cederán el paso a las aeronaves que estén despegando o por despegar?","o":[["A","Aviones livianos a aviones pesados."],["B","Aviones particulares a aviones comerciales."],["C","Toda aeronave en rodaje en el área de maniobras de un aeródromo."],["D","A y B son correctas."]],"a":"C","p":142,"src":"marca"},{"n":23,"s":"La autorización para rodar hacia una pista en un aeródromo controlado, permite cruzar intersecciones de pista, pero no para despegar.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":142,"src":"marca"},{"n":24,"s":"En aquellas oportunidades en que aspectos de carácter geográfico impidan las comunicaciones y no sea posible presentar o cancelar un Plan de Vuelo para dar cumplimiento a los párrafos anteriores y el piloto al mando desee presentar un plan de vuelo hasta y desde el punto de destino, anotará en el formulario Plan de Vuelo, como dato adicional:","o":[["A","No registrará ningún dato adicional."],["B","El aeródromo de destino."],["C","La fecha y hora de regreso prevista, debiendo eso sí garantizar su cumplimiento para evitar la activación inoficiosa del servicio de Alerta."],["D","A y B son correctas."]],"a":"C","p":142,"src":"marca"},{"n":25,"s":"A menos que la torre de control especifique otra cosa, todos los virajes del circuito de tránsito deben efectuarse:","o":[["A","Al final de la pista."],["B","Al inicio de la pista."],["C","A la derecha."],["D","A la izquierda."]],"a":"D","p":143,"src":"marca"},{"n":27,"s":"Ninguna persona actuará como miembro de la tripulación de vuelo o miembro de la tripulación auxiliar de una aeronave civil matriculada en Chile, a menos que sea titular de una licencia apropiada a sus funciones, otorgada por la Dirección General de Aeronáutica Civil (DGAC):","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":143,"src":"marca"},{"n":28,"s":"Durante el tiempo de vuelo, el piloto al mando es el encargado de:","o":[["A","La dirección de la aeronave."],["B","Su operación segura de acuerdo con las regulaciones de circulación aérea y el manual de vuelo."],["C","No tendrá ninguna responsabilidad a bordo."],["D","A y B son correctas."]],"a":"D","p":143,"src":"marca"},{"n":29,"s":"Si Ud. ha infringido los reglamentos o procedimientos locales a causa de una emergencia, ¿qué debe hacer?.","o":[["A","Notificar sin demora a las autoridades locales competentes."],["B","Si la emergencia ha sido controlada con éxito, continuar en forma normal."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":144,"src":"marca"},{"n":30,"s":"Los pilotos al mando dispondrán a bordo de las aeronaves, de toda la información esencial relativa a los servicios de búsqueda y salvamento del área sobre la cual vayan a volar.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":144,"src":"marca"},{"n":31,"s":"La información aeronáutica Chilena, de carácter permanente y que es esencial para la navegación aérea, se pública en dos volúmenes, que son:","o":[["A","AIP CHILE y NOTAMS."],["B","AIP MAP y NOTAMS."],["C","AIP-CHILE Volumen I y AIP-CHILE Volumen II."],["D","GEN y ENR."]],"a":"C","p":144,"src":"marca"},{"n":32,"s":"De acuerdo al Código Aeronáutico, el Comandante de la Aeronave es:","o":[["A","La única y máxima autoridad a bordo, encargado de la dirección de la aeronave y principalmente responsable de su conducción segura."],["B","El que tiene potestad disciplinaria sobre la tripulación, autoridad sobre los pasajeros y el control total sobre la aeronave y la carga transportada."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":144,"src":"marca"},{"n":33,"s":"La autoridad aeronáutica tiene la facultad de controlar e inspeccionar a las aeronaves, a su tripulación y a las personas y cosas transportadas a bordo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":144,"src":"marca"},{"n":34,"s":"Todas las matrículas de aeronaves de Chile comienzan con las letras:","o":[["A","CA."],["B","CH."],["C","CK."],["D","CC."]],"a":"D","p":145,"src":"marca"},{"n":35,"s":"Distancia vertical entre un punto o un nivel de la superficie de la tierra, o unido a ella, y el nivel medio del mar, se denomina:","o":[["A","Altitud."],["B","Altura."],["C","Elevación."],["D","Techo."]],"a":"C","p":145,"src":"marca"},{"n":37,"s":"Dependencia establecida para facilitar servicio de control de tránsito aéreo a los vuelos controlados en las áreas de control bajo su jurisdicción, se denomina:","o":[["A","Oficina de Notificación de los servicios de tránsito aéreo (ARO)."],["B","Dependencia de control de tránsito aéreo."],["C","Centro de control de área (ACC)."],["D","Dependencia de servicio de tránsito."]],"a":"B","p":145,"src":"marca"},{"n":39,"s":"Salvo que la autoridad aeronáutica lo autorice de otro modo, los vuelos VFR se deben realizar sólo dentro del período comprendido entre:","o":[["A","El FCCV y el CCCM."],["B","El CCCM y el FCCV."],["C","A y B son correctas."],["D","Ninguna de las anteriores."]],"a":"D","p":146,"src":"marca"},{"n":41,"s":"El objeto de la luz anticolisión es de llamar la atención hacia la aeronave.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":146,"src":"marca"},{"n":43,"s":"Cruces de un solo color de contraste, amarillo o blanco, colocadas horizontalmente en las pistas y calles de rodaje o partes de las mismas, indican que:","o":[["A","El uso de pistas y calles de rodaje están disponibles para el tránsito."],["B","No existe prohibición de aterrizaje."],["C","El área no es utilizable para el movimiento de aeronaves."],["D","Hay una necesidad de precauciones especiales durante la aproximación y el aterrizaje."]],"a":"C","p":146,"src":"marca"},{"n":44,"s":"Aeródromo público que se encuentra habilitado para la salida y llegada de aeronaves en vuelos internacionales, se denomina:","o":[["A","Aeródromo."],["B","Pista."],["C","Aeropuerto."],["D","Todas las anteriores son correctas."]],"a":"C","p":147,"src":"marca"},{"n":45,"s":"Servicio de control de tránsito aéreo para el tránsito de aeródromo, se denomina:","o":[["A","Servicio de control de aproximación."],["B","Servicio de control de aeródromo."],["C","Servicio de control de área."],["D","Servicio de control de tránsito aéreo."]],"a":"B","p":147,"src":"marca"},{"n":46,"s":"¿Cuál es el período de vigencia de los certificados médicos para la licencia de piloto privado menor de 40 años?","o":[["A","12 meses."],["B","06 meses."],["C","24 meses."],["D","Ninguna de las anteriores."]],"a":"C","p":147,"src":"marca"},{"n":47,"s":"Toda área delimitada, terrestre o acuática habilitada por la autoridad aeronáutica y destinada a la llegada, salida y maniobra de aeronaves en la superficie, se llama:","o":[["A","Aeródromo."],["B","Aeródromo controlado."],["C","Aeródromo de alternativa."],["D","Aeropuerto."]],"a":"A","p":147,"src":"marca"},{"n":48,"s":"Los tipos de aeródromo de alternativa que existen son:","o":[["A","Aeródromo de alternativa post despegue."],["B","Aeródromo de alternativa en ruta."],["C","Aeródromo de alternativa de destino."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":147,"src":"marca"},{"n":49,"s":"Distancia vertical entre un nivel, punto u objeto considerado como punto, y una referencia específica, se denomina:","o":[["A","Altitud de presión."],["B","Altitud de transición."],["C","Altura."],["D","Ninguna de las anteriores."]],"a":"C","p":148,"src":"marca"},{"n":50,"s":"La parte del aeródromo que ha de utilizarse para el despegue, el aterrizaje y el rodaje de aeronaves, excluyendo las plataformas, se denomina:","o":[["A","Área de maniobras."],["B","Área de movimiento."],["C","Área de control."],["D","Altitud de aterrizaje."]],"a":"A","p":148,"src":"marca"},{"n":51,"s":"Expresión de la presión atmosférica mediante la altitud que corresponde a esa presión en la atmósfera tipo.","o":[["A","Altura."],["B","Altitud de transición."],["C","Altitud de presión."],["D","Altitud."]],"a":"C","p":148,"src":"marca"},{"n":52,"s":"La expresión \"AERODROMO CONTROLADO\", significa que es un Aeródromo en que se facilita servicio de control de tránsito aéreo para el tránsito del aeródromo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":148,"src":"marca"},{"n":53,"s":"El símbolo usado para designar las condiciones meteorológicas de vuelo visual, es:","o":[["A","VFR."],["B","IMC."],["C","VMC."],["D","IFR."]],"a":"A","p":148,"src":"marca"},{"n":54,"s":"El espacio aéreo controlado que se extiende hacia arriba desde la superficie terrestre hasta un límite superior especificado, se denomina:","o":[["A","Zona de tránsito de aeródromo."],["B","Zona restringida."],["C","Zona de control."],["D","Zona prohibida."]],"a":"C","p":149,"src":"marca"},{"n":55,"s":"Techo de nubes, es la altura a que, sobre la tierra o el agua, se encuentra la base de la capa inferior de nubes por debajo de 3000 m (9000 ft) y que cubre más de la mitad del cielo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":149,"src":"marca"},{"n":56,"s":"En el caso de que exista peligro de colisión entre dos aeronaves en rodaje en el área de movimiento de un aeródromo, se aplicará lo siguiente:","o":[["A","Cuando dos aeronaves se aproximen de frente, o casi de frente, ambas se detendrán o de ser posible, alterarán su rumbo hacia la derecha para mantenerse a suficiente distancia."],["B","Cuando dos aeronaves se encuentren en un rumbo convergente, la que tenga a la otra a su derecha cederá el paso."],["C","Toda aeronave que sea alcanzada por otra tendrá el derecho de paso y la aeronave que la alcance se mantendrá a suficiente distancia de la trayectoria de la otra aeronave."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":149,"src":"marca"},{"n":57,"s":"La información referente al vuelo proyectado o a parte del mismo, que ha de suministrarse a las dependencias de los servicios de tránsito aéreo, se dará en forma de plan de vuelo. Este se presentará antes de realizar:","o":[["A","Cualquier vuelo o parte del mismo al que tenga que prestarse servicio de control de tránsito aéreo."],["B","Cualquier vuelo dentro de áreas designadas o a lo largo de rutas designadas, cuando así lo requiera la autoridad ATS competente para facilitar el suministro de servicios de información de vuelo, de alerta y de búsqueda y salvamento."],["C","Todo vuelo a través de fronteras internacionales."],["D","Todas las anteriores."]],"a":"D","p":149,"src":"marca"},{"n":58,"s":"En vuelos VFR no se debe despegar ni aterrizar en ningún aeródromo dentro de una zona de control, ni se debe entrar en la zona de tránsito de aeródromos o en el circuito de tránsito de dicho aeródromo, si el techo de nubes y la visibilidad en tierra es inferior a:","o":[["A","300 metros y 1,5 Km."],["B","300 metros y 5 Km."],["C","450 metros y 5 Km."],["D","450 metros y 8 Km."]],"a":"A","p":150,"src":"marca"},{"n":62,"s":"Vuelo VFR Especial, es un Vuelo VFR al que el control de tránsito aéreo ha concedido autorización, de acuerdo a los requisitos establecidos por la autoridad aeronáutica y sólo para ingresar o salir de zonas de control y que vayan a aterrizar o despegar de o en aeródromos situados dentro de las mismas, en condiciones meteorológicas inferiores a las VMC.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"marca"},{"n":63,"s":"Vuelos VFR Nocturno, es aquel Vuelo realizado durante el período comprendido entre el fin del crepúsculo civil vespertino (FCCV) y el comienzo del crepúsculo civil matutino (CCCM), de acuerdo a las reglas de vuelo visual y a los requisitos que establezca la autoridad aeronáutica.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"marca"},{"n":64,"s":"Una aeronave apagando y encendiendo sucesivamente las luces de navegación, de forma tal, que se distingan de las luces de navegación de destellos. Significa que desea avisar que tiene dificultades que la obligan a aterrizar, pero no necesita asistencia inmediata.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"marca"},{"n":65,"s":"El servicio de control de área es el servicio de control de tránsito aéreo para la llegada y salida de vuelos controlados.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"marca"},{"n":66,"s":"El vuelo VFR nocturno, es una excepción al vuelo VFR y podrá ser realizado en zonas designadas por la autoridad aeronáutica competente, bajo condiciones que esta determine en los procedimientos (DAP) correspondientes.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":151,"src":"marca"},{"n":67,"s":"Luz verde fija, tanto en aire como en tierra significa:","o":[["A","Autorizado para aterrizar."],["B","Autorizado para despegar."],["C","Alto."],["D","A y B son correctas."]],"a":"D","p":152,"src":"marca"},{"n":68,"s":"Las listas de verificación serán utilizadas por las tripulaciones de vuelo, Antes, Durante y Después de todas las fases de las operaciones y en caso de emergencias, a fin de asegurar que se cumplen los procedimientos operacionales contenidos en los manuales:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":152,"src":"marca"},{"n":69,"s":"La proyección sobre la superficie terrestre de la trayectoria de una aeronave, cuya dirección en cualquier punto se expresa generalmente en grados a partir del norte (geográfico, magnético o de la cuadrícula), se denomina:","o":[["A","Navegación."],["B","Rumbo."],["C","Vía."],["D","Derrota."]],"a":"B","p":152,"src":"marca"},{"n":70,"s":"Los objetivos de los Servicios de Tránsito Aéreo, son:","o":[["A","Prevenir colisiones entre aeronaves, Prevenir colisiones entre aeronaves en el área de maniobras y entre esas y los obstáculos que haya en dicha área."],["B","Acelerar y mantener ordenadamente el movimiento del tránsito aéreo y proporcionar información útil para la marcha segura y eficaz del vuelo."],["C","Notificar a los organismos pertinentes respecto a las aeronaves que necesitan ayuda de búsqueda y salvamento prestando la mayor colaboración posible a dichos organismos según se requiera."],["D","A, B y C son correctas."]],"a":"D","p":152,"src":"marca"},{"n":71,"s":"Las aeronaves no volarán en formación excepto mediante arreglo previo entre los pilotos al mando de las aeronaves participantes y, para vuelos en formación en el espacio aéreo controlado, de conformidad con las condiciones prescritas por las autoridades ATS competentes.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":153,"src":"marca"},{"n":72,"s":"Cuando dos aeronaves convergen a un nivel aproximadamente igual, los aerodinos propulsados cederán el paso a:","o":[["A","Dirigibles."],["B","Planeadores."],["C","Globos."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":153,"src":"marca"},{"n":73,"s":"El objeto de las luces de navegación es el de indicar a los observadores, la trayectoria relativa de la aeronave.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":153,"src":"marca"},{"n":74,"s":"Las aeronaves que operen en un aeródromo o en sus cercanías, tanto si se hallan o no en una zona de tránsito de aeródromo, deberán entre otras:","o":[["A","Observar el tránsito de aeródromo, a fin de evitar colisiones."],["B","Se ajustarán o evitarán el circuito de tránsito formado por otras aeronaves en vuelo, o evitarlo."],["C","Hacer todos los virajes hacia la izquierda al aproximarse para aterrizar y después del despegue, a menos que se les ordene lo contrario."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":153,"src":"marca"},{"n":75,"s":"La presentación del plan de vuelo en cualquiera de sus formas, no garantiza la provisión del servicio de alerta.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":153,"src":"marca"},{"n":76,"s":"Toda aeronave que opere como vuelo controlado, mantendrá una escucha constante en la radiofrecuencia apropiada, de la dependencia correspondiente de control de tránsito aéreo y cuando sea necesario establecerá comunicación en ambos sentidos con la misma.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":154,"src":"marca"},{"n":77,"s":"El acuse de recibo por parte de una aeronave con falla comunicaciones, en vuelo, durante las horas de luz diurna, es:","o":[["A","Emitiendo destellos dos veces con los faros de aterrizaje de la aeronave, si no tiene, encendiendo y apagando dos veces las luces de navegación."],["B","Moviendo los alerones o el timón de dirección."],["C","Balanceando las alas de la aeronave."],["D","Ninguna de las anteriores es verdadera."]],"a":"B","p":154,"src":"marca"},{"n":78,"s":"Se denomina aeronave que alcanza a la que se aproxima a otra por detrás, siguiendo una línea que forme un ángulo menor de 70 grados con el plano de simetría de la que va delante.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":154,"src":"marca"},{"n":80,"s":"La distancia vertical entre un nivel, punto u objeto considerado como punto y una referencia específica, se denomina:","o":[["A","Altitud de presión."],["B","Altura."],["C","Altitud de transición."],["D","A y B son correctas."]],"a":"B","p":154,"src":"marca"},{"n":81,"s":"Parte del área de movimiento destinada al aterrizaje o despegue de aeronaves, se denomina:","o":[["A","Área de control."],["B","Área de aterrizaje."],["C","Área de maniobras."],["D","Área de movimiento."]],"a":"C","p":155,"src":"marca"},{"n":82,"s":"Área de control o parte de ella dispuesta en forma de corredor, se denomina:","o":[["A","AFIS."],["B","Altitud."],["C","Aerovía."],["D","Área de Control."]],"a":"C","p":155,"src":"marca"},{"n":83,"s":"Calle de rodaje. Se define como una vía definida en un aeródromo terrestre, establecida para el rodaje de aeronaves y destinada a proporcionar enlace entre una y otra parte del aeródromo, incluyendo:","o":[["A","Calle de acceso al puesto de estacionamiento de aeronave."],["B","Calle de rodaje en la plataforma."],["C","Calle de salida rápida."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":155,"src":"marca"},{"n":84,"s":"Condiciones meteorológicas expresadas en términos de visibilidad, y distancia desde las nubes y techos de nubes, inferiores a las mínimas especificadas para las condiciones meteorológicas de vuelo visual, se denomina:","o":[["A","Condiciones meteorológicas de vuelo por instrumentos."],["B","Condiciones meteorológicas de vuelo visual."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"A","p":155,"src":"marca"},{"n":85,"s":"Espacio aéreo de dimensiones definidas dentro del cual se facilita el servicio de control de tránsito aéreo de conformidad con la clasificación del espacio aéreo.","o":[["A","Espacio aéreo con servicio de asesoramiento."],["B","Área de control."],["C","Espacio aéreo controlado."],["D","Centro de control de área."]],"a":"C","p":156,"src":"marca"},{"n":86,"s":"Símbolo utilizado para designar las condiciones meteorológicas de vuelo por instrumentos:","o":[["A","VMC."],["B","IFC."],["C","IFR."],["D","IMC."]],"a":"C","p":156,"src":"marca"},{"n":90,"s":"Se denomina \"Plan de Vuelo\" a la información especificada que, respecto a un vuelo proyectado o a parte de un vuelo de una aeronave, se somete a las dependencias de los servicios de tránsito aéreo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":157,"src":"marca"},{"n":91,"s":"El Plan de vuelo que comprende las modificaciones, si las hay, que resultan de incorporar autorizaciones posteriores, se denomina:","o":[["A","Plan de Vuelo."],["B","Plan de vuelo presentado."],["C","Plan de vuelo actualizado."],["D","Plan de vuelo repetitivo."]],"a":"C","p":157,"src":"marca"},{"n":92,"s":"Los planes de vuelo relativos a cada uno de los vuelos regulares que se realizan frecuentemente con idénticas características básicas, presentados, por los explotadores para que las dependencias de los servicios de tránsito aéreo (ATS) los conserven y utilicen repetidamente, se denomina:","o":[["A","Plan de Vuelo."],["B","Plan de vuelo presentado."],["C","Plan de vuelo Actualizado."],["D","Plan de Vuelo repetitivo."]],"a":"D","p":157,"src":"marca"},{"n":93,"s":"El punto en el cual una aeronave que navega en un tramo de una ruta ATS definida por referencia a los radiofaros omnidireccionales VHF, se espera que transfiera su referencia de navegación primaria, de la instalación por detrás de la aeronave a la instalación inmediata por delante de la aeronave, se denomina:","o":[["A","Punto de notificación."],["B","Punto de notificación facultativo."],["C","Punto de notificación obligatorio."],["D","Punto de cambio."]],"a":"D","p":158,"src":"marca"},{"n":96,"s":"El servicio de control de tránsito aéreo para la llegada y salida de vuelos controlados, se denomina:","o":[["A","Servicio de control de aproximación."],["B","Servicio de control de aeródromo."],["C","Servicio de control de área."],["D","Servicio de información de vuelo."]],"a":"B","p":158,"src":"marca"},{"n":97,"s":"El servicio cuya finalidad es aconsejar y facilitar información útil para la realización segura y eficaz de los vuelos, se denomina:","o":[["A","Servicio de Control de Aproximación."],["B","Servicio de Control de aeródromo."],["C","Servicio de información de vuelo de aeródromo."],["D","Servicio de información de Vuelo."]],"a":"D","p":158,"src":"marca"},{"n":98,"s":"La expresión genérica que se aplica, según el caso, a los servicios de información de vuelo, alerta, asesoramiento de tránsito aéreo, control de tránsito aéreo, servicios de control de área, control de aproximación o control de aeródromos, se denomina:","o":[["A","Servicio de Tránsito Aéreo."],["B","Servicio de Información de Vuelo."],["C","Servicio de Control de Vuelo."],["D","Servicio de Control de Área."]],"a":"A","p":159,"src":"marca"},{"n":100,"s":"Se denomina tránsito de aeródromo a todo el tránsito que tiene lugar en el área de maniobras de un aeródromo, y todas las aeronaves que vuelen en las inmediaciones del mismo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":159,"src":"marca"},{"n":101,"s":"Un piloto con experiencia que proyecta efectuar un vuelo Santiago- Puerto Montt, no necesita familiarizarse con toda la información disponible apropiada al vuelo, por cuanto gran parte de esa información siempre es conocida.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":159,"src":"marca"},{"n":102,"s":"Cederán el paso a las aeronaves que estén aterrizando o en las fases finales de una aproximación para aterrizar.","o":[["A","Las aeronaves en vuelo."],["B","Las que estén operando en tierra o agua."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":159,"src":"marca"},{"n":103,"s":"El piloto al mando puede, ya sea en vuelo u operando en el área de movimiento de un aeródromo, apagar o reducir la intensidad de cualquiera luz de destello de a bordo, cuando:","o":[["A","Dichas luces pudieran afectar adversamente el desempeño satisfactorio de sus funciones."],["B","Expongan a un observador externo a un deslumbramiento perjudicial."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"C","p":160,"src":"marca"},{"n":104,"s":"Que precauciones u observaciones (entre otras) deberán tener las aeronaves que operen en un aeródromo o en sus cercanías, tanto si se hallan o no en una zona de tránsito de aeródromo.","o":[["A","Observar el transito del aeródromo, a fin de evitar colisiones."],["B","De ajustarse al circuito de transito formado por otras aeronaves en vuelo, o evitarlas."],["C","Harán todos los virajes hacia la izquierda al aproximarse para aterrizar y después del despegue, a menos que se les ordene lo contrario."],["D","Todas anteriores son verdaderas."]],"a":"D","p":160,"src":"marca"},{"n":105,"s":"Toda aeronave que sea alcanzada por otra tendrá el derecho de paso, y la que alcance cambiará su rumbo para mantener suficiente distancia.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":160,"src":"marca"},{"n":106,"s":"Cuando dos aeronaves se aproximen de frente o casi de frente, y haya peligro de colisión, ambas aeronaves deben alterar su ......... hacia la ...........:","o":[["A","Distancia - Izquierda."],["B","Velocidad - Izquierda."],["C","Rumbo - Derecha."],["D","Rumbo - Izquierda."]],"a":"C","p":160,"src":"marca"},{"n":107,"s":"Un vuelo controlado deberá notificar a las dependencias correspondientes de los servicios de tránsito aéreo, tan pronto como sea posible, la hora y nivel a que se pasa cada uno de los puntos de notificación obligatorio designados.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":161,"src":"marca"},{"n":108,"s":"Las medidas que ha de adoptar la aeronave interceptada, son:","o":[["A","Seguirá inmediatamente las instrucciones dadas por la aeronave interceptora, interpretando y respondiendo a las señales visuales de acuerdo con las especificadas en el Apéndice D del DAN 91."],["B","Lo notificará inmediatamente, si es posible, a la dependencia ATS apropiada."],["C","Tratará inmediatamente de comunicarse por radio con la aeronave interceptora o con la dependencia de control de interceptación apropiada y si está equipada con respondedor SSR, seleccionará inmediatamente el modo A, Código 7700."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":161,"src":"marca"},{"n":110,"s":"ZONA DE TOMA DE CONTACTO: se denomina a:","o":[["A","Parte de la pista, situada después del umbral, destinada a que los aviones que aterrizan hagan el primer contacto con la pista."],["B","Zona donde se debe establecer el primer contacto radiofónico en las inmediaciones de un aeródromo."],["C","Zona donde se establece una comunicación aeronáutica."],["D","Zona nula."]],"a":"C","p":161,"src":"marca"},{"n":111,"s":"¿Qué significado tiene una señal blanca y horizontal en forma de pesas, ubicada en un área de señales?:","o":[["A","Autoriza solo el uso de pistas."],["B","Son instrucciones para el rodaje."],["C","Aviso que hay planeadores volando."],["D","Indica que las aeronaves deben aterrizar, despegar y rodar únicamente en las pistas y en las calles de rodaje."]],"a":"D","p":162,"src":"marca"},{"n":113,"s":"Hoy en día en un ambiente de vuelo saturado, la primera responsabilidad en cuanto a evitar colisiones recae casi completamente en la torre de control.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":162,"src":"marca"},{"n":114,"s":"Para operar un avión dentro del ATZ de un Aeropuerto, debe mantener comunicación de radio a lo menos en un sentido.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":162,"src":"marca"},{"n":115,"s":"Servicio de Alerta, es el servicio suministrado para notificar a los organismos pertinentes respecto a aeronaves que necesitan ayuda de búsqueda y salvamento, y auxiliar a dichos organismos según convenga.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":162,"src":"marca"},{"n":116,"s":"La autorización para el rodaje, en un aeródromo controlado, debe obtenerlo del:","o":[["A","ACC."],["B","Control terrestre."],["C","AFIS."],["D","Oficina A.R.O."]],"a":"B","p":163,"src":"marca"},{"n":119,"s":"Cuando se presente un Plan de Vuelo a una oficina de notificación de los servicios de tránsito aéreo (ARO), este solo debe ser presentado por el Piloto al Mando antes de la salida.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":163,"src":"marca"},{"n":120,"s":"Durante el desempeño de las atribuciones aeronáuticas que confieren las licencias o habilitaciones, el titular de una licencia deberá llevar consigo el correspondiente documento para exhibirlo a las autoridades aeronáuticas, cuando le sea requerida.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":163,"src":"marca"},{"n":121,"s":"El período de validez de la licencia para un piloto privado que tiene más de 40 años, es:","o":[["A","12 meses."],["B","06 meses."],["C","24 meses."],["D","Ninguna de las anteriores."]],"a":"A","p":164,"src":"marca"},{"n":122,"s":"La edad mínima para poder optar a la licencia de Piloto Privado, es:","o":[["A","16 años."],["B","17 años."],["C","18 años."],["D","21 años."]],"a":"C","p":164,"src":"marca"},{"n":123,"s":"Un alumno o aspirante a la licencia de piloto privado no debe poseer un certificado médico extendido por un medico de medicina general, autorizado por la DGAC, mientras reciba instrucción de vuelo.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"B","p":164,"src":"marca"},{"n":124,"s":"Todas aquellas comprobaciones que se efectúan a intervalos de tiempo regulares o después de un cierto número de horas de funcionamiento de una aeronave, se denomina:","o":[["A","Inspecciones periódicas."],["B","Trabajos Aéreos."],["C","Mantenimiento."],["D","Inspector Visual."]],"a":"A","p":164,"src":"marca"},{"n":125,"s":"Las normas contenidas en la DAN 91, \"REGLAS DE VUELO Y DE OPERACIÓN DE AVIACIÓN GENERAL\", se aplicarán a todas las aeronaves civiles nacionales dondequiera que estén, en cuanto no se opongan al Reglamento vigente del Estado que tenga jurisdicción sobre el territorio o espacio aéreo en el cual operen.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":164,"src":"marca"},{"n":126,"s":"El piloto al mando observará las leyes, reglamentos y procedimientos pertinentes de los Estados en que opere la aeronave.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":165,"src":"marca"},{"n":127,"s":"¿En qué caso el piloto al mando puede tomar medidas que infrinjan los reglamentos o los procedimientos locales?","o":[["A","En caso de emergencia que ponga en peligro la seguridad de la aeronave o de las personas."],["B","En ningún caso."],["C","Solo en caso de incendio de la aeronave."],["D","Solo en condiciones meteorológicas adversas."]],"a":"A","p":165,"src":"marca"},{"n":128,"s":"En qué circunstancias está prohibido fumar en las aeronaves.","o":[["A","Durante el movimiento de la aeronave en la superficie."],["B","En cada despegue, cada aterrizaje."],["C","Cuando lo considere necesario el piloto al mando."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":165,"src":"marca"},{"n":129,"s":"Que equipos (Utensilios) y documentación entre otros deberán poseer las aeronaves en todos los vuelos:","o":[["A","Al menos un botiquín de primeros auxilios, un extinguidor, cinturones de seguridad para cada asiento, fusibles eléctricos de repuesto."],["B","El manual de vuelo del avión, cartas aeronáuticas actualizadas, las claves de señales de tierra-aire y aire-tierra con fines de búsqueda y salvamento."],["C","Certificado matrícula de la aeronave y certificado aeronavegabilidad."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":165,"src":"marca"},{"n":133,"s":"Los aeródromos civiles se dividen en:","o":[["A","Aeródromos públicos y privados."],["B","Aeródromos militares y públicos."],["C","Aeródromos públicos, privados y militares."],["D","Ninguna de las anteriores."]],"a":"A","p":166,"src":"marca"},{"n":134,"s":"En caso de emergencia, cualquier aeronave podrá aterrizar en aeródromos privados o en superficies que no sean aeródromos:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":166,"src":"marca"},{"n":135,"s":"Normalmente la frecuencia que utilizarán las aeronaves para transmitir su posición e intenciones, cuando operen en un aeródromo o sus inmediaciones y este no es controlado o con AFIS, es:","o":[["A","110, 1 MHZ."],["B","119, 1 MHZ."],["C","119, 2 MHZ."],["D","118, 2 MHZ."]],"a":"D","p":166,"src":"marca"},{"n":136,"s":"Una aeronave que esté volando con Plan de Vuelo visual, en las cercanías de un aeródromo con servicio AFIS, deberá:","o":[["A","Estar alerta a cualquier llamado."],["B","Contactar a 10 MN del AFIS en la Frecuencia apropiada para notificar posición, altitud o nivel e intenciones."],["C","Pasar inadvertido."],["D","Ninguna de las anteriores."]],"a":"B","p":167,"src":"marca"},{"n":138,"s":"Aeronáutica no comercial es la que tiene por objeto actividades de vuelo sin fines de lucro, tales como la instrucción, recreación o deporte. La aviación no comercial no podrá realizar servicios de transporte o trabajos aéreos remunerados. Sin embargo, previa autorización de la Junta de Aeronáutica Civil, la aviación no comercial podrá efectuar servicios de transporte o trabajos aéreos pagados, siempre que éstos no persigan fines de lucro, cuando la aeronáutica comercial no esté en condiciones de prestar dichos servicios.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":167,"src":"marca"},{"n":139,"s":"Reglamentos Aeronáuticos (DAR): Son disposiciones que establecen normas de carácter general reglamentario orientadas a entregar seguridad y diversos servicios a la navegación aérea. Su numeración y su formato se derivan de los Anexos al Convenio de Aviación Civil Internacional (OACI).","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":167,"src":"marca"},{"n":141,"s":"La mejor fuente de información para buscar una frecuencia del control de tierra de un determinado aeródromo controlado, es:","o":[["A","El Manual de información del piloto."],["B","Una carta aeronáutica."],["C","La AIP-CHILE."],["D","Una estación aeronáutica."]],"a":"C","p":168,"src":"marca"},{"n":142,"s":"Ninguna aeronave será autorizada para el vuelo sin la previa expedición de un certificado de aeronavegabilidad por parte de la autoridad aeronáutica.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":168,"src":"marca"},{"n":143,"s":"En toda aeronave que vuele sobre territorio nacional se deben portar los siguientes documentos:","o":[["A","Certificado de matrícula y de aeronavegabilidad."],["B","Licencias y habilitaciones de la tripulación y bitácoras."],["C","Documentos relativos a la aeronave, a los pasajeros, a la carga y a la correspondencia, que requieran los reglamentos."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":168,"src":"marca"},{"n":145,"s":"Para los efectos del código Aeronáutico, se entiende que una aeronave se encuentra en vuelo desde el momento en que:","o":[["A","Pone en marcha el motor."],["B","Enciende las luces de navegación."],["C","Comienza a moverse con el objeto de despegar, hasta detenerse una vez finalizado el vuelo."],["D","Cuando aplica potencia para despegar."]],"a":"C","p":169,"src":"marca"},{"n":146,"s":"Aquella persona que, sin haber obtenido las licencias o habilitaciones competentes, desempeñare a bordo de una aeronave en vuelo actividades como tripulante de vuelo, será castigado con presidio o reclusión.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"marca"},{"n":147,"s":"Excepto los vuelos que se efectúen sobre 3000 Ft AGL, las aeronaves no volarán en formación excepto mediante arreglo previo entre los pilotos al mando de las aeronaves participantes.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"marca"},{"n":149,"s":"Se presentará un plan de vuelo a una oficina de notificación de los servicios de tránsito aéreo (ARO) (ya sea personalmente, por medio telefónico, correo electrónico o fax) antes de la salida, o se transmitirá durante el vuelo, a la dependencia de los servicios de tránsito aéreo o a la estación de radio de control aeroterrestre competente:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":169,"src":"marca"},{"n":150,"s":"Se exceptúan de la presentación de un Plan de Vuelo:","o":[["A","Los vuelos VFR locales."],["B","Los vuelos VFR entre aeródromos que se encuentren ubicados dentro de los límites laterales de una Zona de Control."],["C","Todos los vuelos VFR."],["D","A y B son correctas."]],"a":"D","p":170,"src":"marca"},{"n":152,"s":"El piloto al mando de la aeronave tiene autoridad decisiva en todo lo relacionado con ella, mientras esté al mando de la misma.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":170,"src":"marca"},{"n":154,"s":"Se entenderá por abandonada una aeronave cuando concurran los siguientes requisitos:","o":[["A","Que se encuentre sin actividades de vuelo, por más de un año, en un aeródromo público."],["B","Que vencido el año, la autoridad aeronáutica notifique dicha circunstancia, por tres veces en el Diario Oficial, mediando a lo menos quince días entre cada aviso, indicando la matrícula de la aeronave, el nombre y domicilio del propietario y las hipotecas, privilegios, embargos u otros gravámenes que la afecten, según consten en el Registro Nacional de Aeronaves."],["C","Que transcurridos treinta días desde el último aviso, no se presente el propietario u otros interesados a resolver sobre el destino de la aeronave y a responder por los gastos o perjuicios que tal situación hubiere ocasionado. Vencido el plazo indicado en la letra c), la aeronave se perderá irrevocablemente para el dueño y para los demás titulares de derechos en ella, e ingresará al dominio fiscal como recurso de la Dirección General de Aeronáutica Civil, la que dispondrá de ella."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":171,"src":"marca"},{"n":155,"s":"Cuál de las siguientes publicaciones, tiene carácter de oficial para buscar información aeronáutica en Chile:","o":[["A","Revistas aeronáuticas."],["B","Informativos Fedach."],["C","AIP Volumen I y II."],["D","Todas las anteriores son verdaderas."]],"a":"C","p":171,"src":"marca"},{"n":156,"s":"\"Es ZONA DE PROTECCION\" de la infraestructura aeronáutica, el espacio aéreo sobre:","o":[["A","Los aeródromos públicos o militares."],["B","Las inmediaciones terrestres o acuáticas de dichos aeródromos."],["C","Las instalaciones de ayuda y protección a la navegación aérea."],["D","Todas las anteriores."]],"a":"D","p":171,"src":"marca"},{"n":157,"s":"Cuando se opera en un aeródromo controlado, sobre el mismo, o en sus cercanías. Las aeronaves no deben rodar hacia una pista, ni despegar ni aterrizar, a menos que hayan recibido autorización de la torre de control.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":171,"src":"marca"},{"n":158,"s":"El código aeronáutico es una información referencial, que no debe contraponerse al:","o":[["A","DAR 01."],["B","DAR 91."],["C","DAP 11."],["D","Ninguno de los anteriores."]],"a":"D","p":172,"src":"marca"},{"n":159,"s":"Cuando UD. vuela una aeronave sobre agua a una distancia de la costa superior a la de planeo, deberá:","o":[["A","Llevar un bote para la tripulación."],["B","Llevar un chaleco salvavidas o dispositivo de flotación individual equivalente para cada persona que vaya a bordo."],["C","Llevar mascaras de oxígeno."],["D","Todas las anteriores son verdaderas."]],"a":"B","p":172,"src":"marca"},{"n":160,"s":"¿Cómo un piloto puede saber la hora UTC de un día determinado del año en Chile?:","o":[["A","Buscando información en revistas relacionadas."],["B","Buscando información en la AIP-CHILE."],["C","Preguntándole siempre a su instructor cada vez que quiera realizar un vuelo."],["D","Da lo mismo la hora UTC."]],"a":"B","p":172,"src":"marca"},{"n":162,"s":"Las áreas o zonas militares, están consideradas como Zonas Especiales:","o":[["A","Restringidas."],["B","Prohibidas."],["C","Peligrosas."],["D","Ninguna de las anteriores."]],"a":"B","p":172,"src":"marca"},{"n":163,"s":"La dependencia establecida para facilitar servicio de información de vuelo y servicio de alerta, se denomina:","o":[["A","Area de control."],["B","Servicio de información de vuelo de Aeródromo (AFIS)."],["C","Centro de control de área."],["D","Area de control terminal."]],"a":"B","p":173,"src":"marca"},{"n":164,"s":"El piloto al mando de la aeronave, manipule o no los mandos, es responsable de que la operación de ésta se realice de acuerdo con lo dispuesto en DAN 91:","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":173,"src":"marca"},{"n":167,"s":"Las disposiciones del DAR 91 \"“Reglas de Vuelo y Operación General\", se aplicarán:","o":[["A","A todas las aeronaves civiles nacionales dondequiera que estén, en cuanto no se opongan al Reglamento vigente en el Estado que tenga jurisdicción sobre el territorio o espacio aéreo en el cual operen."],["B","A las aeronaves militares nacionales en cuanto realicen operaciones aéreas que no sean operaciones aéreas militares y a las aeronaves de Carabineros y de Policía de Investigaciones en cuanto realicen operaciones que no sean operaciones aéreas policiales."],["C","A todas las aeronaves que se encuentren dentro de los límites de las Regiones de Información de Vuelo en que se haya dividido el espacio aéreo chileno."],["D","Todas las anteriores son verdaderas."]],"a":"D","p":174,"src":"marca"},{"n":168,"s":"En qué oportunidad, el piloto al mando (si así lo desea) presentará un plan de vuelo hasta y desde el punto de destino:","o":[["A","Cuando sea obligado a ello, porque alguien se lo dispuso."],["B","Cuando la Autoridad Aeronáutica se lo ordene."],["C","Por comodidad del piloto."],["D","Cuando debido a aspectos de carácter geográfico impidan las comunicaciones y no sea posible presentar o cancelar un Plan de Vuelo para dar cumplimiento a lo dispuesto en el DAN 91."]],"a":"D","p":175,"src":"marca"},{"n":169,"s":"Nadie podrá pilotar una aeronave bajo la influencia de un narcótico o estupefaciente.","o":[["A","VERDADERO."],["B","FALSO."]],"a":"A","p":175,"src":"marca"},{"n":170,"s":"En sentido aeronáutico se entiende por visibilidad, a:","o":[["A","La distancia máxima a la que puede verse y reconocerse un objeto de color negro de dimensiones convenientes, situado cerca del suelo, al ser observado ante un fondo brillante."],["B","La distancia máxima a la que puedan verse e identificarse las luces de aproximadamente mil candelas ante un fondo no iluminado."],["C","A y B son correctas."],["D","A y B son falsas."]],"a":"A","p":175,"src":"marca"}]}]}];
const LOGO=`<svg viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" fill="#1d4ed8"/><g fill="#fff"><rect x="236" y="70" width="40" height="330" rx="20"/><rect x="40" y="170" width="432" height="74" rx="14"/><rect x="166" y="372" width="180" height="44" rx="12"/><rect x="246" y="46" width="20" height="30" rx="6"/><rect x="200" y="56" width="112" height="10" rx="5"/></g><text x="256" y="221" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="54" fill="#1d4ed8" letter-spacing="6">SCCV</text></svg>`;
const KEY='curacafly-v1';
let S={bank:0,sub:-1,st:{}};try{Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=document.getElementById('app');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bank=()=>DATA[S.bank]||DATA[0];
const id=(si,q)=>S.bank+':'+si+':'+q.n;
const year=d=>(d.name.match(/20\d\d/)||[''])[0];
const items=()=>{const r=[];bank().subjects.forEach((s,i)=>{if(S.sub<0||S.sub===i)s.q.forEach(q=>r.push([i,q]))});return r};
const count=l=>l.filter(([i,q])=>S.st[id(i,q)]===1).length;
let timer=null,pos=-1;

function home(){
  clearTimeout(timer);document.onclick=null;
  const b=bank();if(S.sub>=b.subjects.length)S.sub=-1;
  const l=items(),c=count(l),done=c===l.length,started=l.some(([i,q])=>S.st[id(i,q)]!=null);
  $.innerHTML=`<h1>CuracaFly</h1><p class="sub">Preguntas DGAC · Piloto Privado · SCCV</p>
  <label for="b">Banco de preguntas</label><select id="b">${DATA.map((d,i)=>`<option value="${i}" ${i==S.bank?'selected':''}>Banco ${year(d)}</option>`).join('')}</select>
  <label for="m">Materia</label><select id="m"><option value="-1">Todas las materias</option>${b.subjects.map((s,i)=>`<option value="${i}" ${i===S.sub?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
  <p class="prog">Correctas: <b>${c} de ${l.length}</b></p>
  <button class="go" id="go">${done?'Empezar de nuevo':started?'Seguir estudiando':'Comenzar'}</button>
  <p class="foot">Preguntas copiadas tal cual de los documentos. Tu avance se guarda solo en este teléfono.</p>`;
  document.getElementById('b').onchange=e=>{S.bank=+e.target.value;S.sub=-1;save();home()};
  document.getElementById('m').onchange=e=>{S.sub=+e.target.value;save();home()};
  document.getElementById('go').onclick=()=>{if(done)l.forEach(([i,q])=>delete S.st[id(i,q)]);save();pos=-1;ask()};
}

// Primero las no respondidas, en orden; después vuelven las falladas.
function pick(l){
  let k=l.findIndex(([i,q])=>S.st[id(i,q)]==null);
  if(k>=0)return k;
  for(let n=1;n<=l.length;n++){const j=(pos+n)%l.length;if(S.st[id(l[j][0],l[j][1])]===0)return j}
  return -1;
}

function ask(){
  document.onclick=null;
  const l=items();pos=pick(l);
  if(pos<0)return home();
  const [si,q]=l[pos];
  $.innerHTML=`<div class="head"><button class="back" id="h">Volver</button><span>Correctas: ${count(l)} de ${l.length}</span></div>
  <div class="mat">${esc(bank().subjects[si].name)} · Pregunta ${q.n}</div>
  <div class="stem">${esc(q.s)}</div>
  ${q.o.map(([a,t])=>`<button class="opt" data-l="${esc(a)}"><b>${esc(a)}</b><span>${esc(t)}</span></button>`).join('')}
  <div class="msg" id="msg"></div>`;
  window.scrollTo(0,0);
  document.getElementById('h').onclick=home;
  document.querySelectorAll('.opt').forEach(o=>o.onclick=ev=>{
    ev.stopPropagation();
    const good=o.dataset.l===q.a;S.st[id(si,q)]=good?1:0;save();
    document.querySelectorAll('.opt').forEach(x=>{x.onclick=null;if(x.dataset.l===q.a)x.classList.add('ok');else if(x===o)x.classList.add('bad')});
    const m=document.getElementById('msg');m.className='msg '+(good?'ok':'bad');m.textContent=good?'Correcta':'Incorrecta. La correcta es la '+q.a;
    const next=()=>{clearTimeout(timer);ask()};
    timer=setTimeout(next,good?1000:4000);
    document.onclick=e=>{if(!e.target.closest('.back'))next()};
    document.getElementById('h').onclick=e=>{e.stopPropagation();home()};
  });
}
home();
</script>
